<svg xmlns="http://www.w3.org/2000/svg" width="760" height="2640" viewBox="0 0 380 1320" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Despliegue del laboratorio Hadoop de la sesión 1, vista móvil</title>
  <desc id="descripcion">Vista vertical del clúster de cuatro contenedores: namenode contiene NameNode, ResourceManager y ApplicationHistoryServer; datanode1, datanode2 y datanode3 contienen cada uno DataNode y NodeManager. Los procesos HDFS se muestran en azul verdoso y los procesos YARN en naranja.</desc>
  <!-- Procedencia: 26-27/sesiones/s1/s1.ipynb, sección El clúster que se va a utilizar. Contraste: compose-hadoop-cluster.yml y make-images/namenode.sh/datanode.sh. -->
  <defs>
    <marker id="punta-hdfs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087e83"/>
    </marker>
    <marker id="punta-yarn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45a20"/>
    </marker>
    <style>
      text { font-family: "Atkinson Hyperlegible", Inter, "Segoe UI", Arial, sans-serif; fill: #17324a; }
      .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.7px; fill: #52687b; }
      .title { font-size: 20px; font-weight: 700; fill: #102d45; }
      .subtitle { font-size: 12px; fill: #52687b; }
      .container { fill: #ffffff; stroke: #9aabba; stroke-width: 1.5; }
      .container-head { font-size: 17px; font-weight: 700; }
      .resource { font-size: 11px; font-weight: 700; fill: #40566a; }
      .tile-hdfs { fill: #e6f4f3; stroke: #087e83; stroke-width: 1.3; }
      .tile-yarn { fill: #fff1e6; stroke: #b45a20; stroke-width: 1.3; }
      .service { font-size: 16px; font-weight: 700; }
      .service-small { font-size: 14px; font-weight: 700; }
      .detail { font-size: 11.5px; fill: #40566a; }
      .detail-strong { font-size: 11px; font-weight: 700; fill: #40566a; }
      .route-hdfs { fill: none; stroke: #087e83; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .route-yarn { fill: none; stroke: #b45a20; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .legend { font-size: 11.5px; fill: #40566a; }
    </style>
  </defs>

  <rect width="380" height="1320" rx="15" fill="#f5f8fb"/>
  <text x="16" y="25" class="eyebrow">SESIÓN 1 · ARQUITECTURA REAL</text>
  <text x="16" y="52" class="title">Laboratorio Hadoop</text>
  <text x="16" y="73" class="subtitle">4 contenedores · 9 demonios · red hadoop-cluster</text>

  <!-- Contenedor namenode -->
  <rect x="15" y="91" width="350" height="333" rx="12" class="container"/>
  <text x="28" y="117" class="container-head">namenode</text>
  <text x="351" y="116" text-anchor="end" class="resource">2 vCPU · 4096 MiB Docker</text>
  <rect x="28" y="132" width="324" height="77" rx="9" class="tile-hdfs"/>
  <text x="41" y="157" class="service">NameNode · HDFS</text>
  <text x="41" y="178" class="detail">Metadatos, permisos y ubicación de bloques.</text>
  <text x="41" y="196" class="detail-strong">RPC :9000 · web localhost:9870</text>
  <rect x="28" y="220" width="324" height="80" rx="9" class="tile-yarn"/>
  <text x="41" y="245" class="service">ResourceManager · YARN</text>
  <text x="41" y="266" class="detail">Vista global, planificación y asignación.</text>
  <text x="41" y="285" class="detail-strong">Web localhost:8088</text>
  <path d="M 190 301 V 310" class="route-yarn" marker-end="url(#punta-yarn)"/>
  <rect x="28" y="312" width="324" height="76" rx="9" class="tile-yarn"/>
  <text x="41" y="337" class="service-small">ApplicationHistoryServer</text>
  <text x="41" y="358" class="detail">Timeline Server · recibe eventos y métricas de YARN.</text>
  <text x="41" y="377" class="detail-strong">RPC :10200 · web localhost:8188</text>
  <text x="28" y="410" class="detail-strong">Alias de red: resourcemanager y timelineserver</text>

  <!-- Resumen de conexiones -->
  <rect x="15" y="439" width="350" height="122" rx="11" fill="#ffffff" stroke="#d0dce5" stroke-width="1.2"/>
  <text x="190" y="463" text-anchor="middle" font-size="13" font-weight="700">Procesos conectados por Docker</text>
  <line x1="29" y1="485" x2="48" y2="485" class="route-hdfs" marker-end="url(#punta-hdfs)"/>
  <text x="58" y="489" class="detail-strong">HDFS · bloques, latidos e informes</text>
  <text x="58" y="505" class="detail">NameNode ↔ DataNodes</text>
  <line x1="29" y1="528" x2="48" y2="528" class="route-yarn" marker-end="url(#punta-yarn)"/>
  <text x="58" y="532" class="detail-strong">YARN · registro, latidos y asignaciones</text>
  <text x="58" y="548" class="detail">ResourceManager ↔ NodeManagers</text>

  <!-- Rutas compartidas desde los procesos coordinadores -->
  <path d="M 28 171 H 9 V 1027" class="route-hdfs"/>
  <path d="M 352 259 H 371 V 1086" class="route-yarn"/>

  <!-- Contenedor datanode1 -->
  <rect x="15" y="585" width="350" height="168" rx="12" class="container"/>
  <text x="28" y="611" class="container-head">datanode1</text>
  <text x="351" y="610" text-anchor="end" class="resource">2 vCPU · 3072 MiB</text>
  <path d="M 9 657 H 28" class="route-hdfs" marker-start="url(#punta-hdfs)" marker-end="url(#punta-hdfs)"/>
  <rect x="28" y="626" width="324" height="52" rx="8" class="tile-hdfs"/>
  <text x="41" y="648" class="service-small">DataNode</text>
  <text x="41" y="666" class="detail">Almacena y sirve bloques; volumen propio.</text>
  <path d="M 371 716 H 352" class="route-yarn" marker-start="url(#punta-yarn)" marker-end="url(#punta-yarn)"/>
  <rect x="28" y="691" width="324" height="49" rx="8" class="tile-yarn"/>
  <text x="41" y="712" class="service-small">NodeManager</text>
  <text x="41" y="730" class="detail">Contenedores YARN · 2 vcores · 2560 MiB</text>

  <!-- Contenedor datanode2 -->
  <rect x="15" y="770" width="350" height="168" rx="12" class="container"/>
  <text x="28" y="796" class="container-head">datanode2</text>
  <text x="351" y="795" text-anchor="end" class="resource">2 vCPU · 3072 MiB</text>
  <path d="M 9 842 H 28" class="route-hdfs" marker-start="url(#punta-hdfs)" marker-end="url(#punta-hdfs)"/>
  <rect x="28" y="811" width="324" height="52" rx="8" class="tile-hdfs"/>
  <text x="41" y="833" class="service-small">DataNode</text>
  <text x="41" y="851" class="detail">Almacena y sirve bloques; volumen propio.</text>
  <path d="M 371 901 H 352" class="route-yarn" marker-start="url(#punta-yarn)" marker-end="url(#punta-yarn)"/>
  <rect x="28" y="876" width="324" height="49" rx="8" class="tile-yarn"/>
  <text x="41" y="897" class="service-small">NodeManager</text>
  <text x="41" y="915" class="detail">Contenedores YARN · 2 vcores · 2560 MiB</text>

  <!-- Contenedor datanode3 -->
  <rect x="15" y="955" width="350" height="168" rx="12" class="container"/>
  <text x="28" y="981" class="container-head">datanode3</text>
  <text x="351" y="980" text-anchor="end" class="resource">2 vCPU · 3072 MiB</text>
  <path d="M 9 1027 H 28" class="route-hdfs" marker-start="url(#punta-hdfs)" marker-end="url(#punta-hdfs)"/>
  <rect x="28" y="996" width="324" height="52" rx="8" class="tile-hdfs"/>
  <text x="41" y="1018" class="service-small">DataNode</text>
  <text x="41" y="1036" class="detail">Almacena y sirve bloques; volumen propio.</text>
  <path d="M 371 1086 H 352" class="route-yarn" marker-start="url(#punta-yarn)" marker-end="url(#punta-yarn)"/>
  <rect x="28" y="1061" width="324" height="49" rx="8" class="tile-yarn"/>
  <text x="41" y="1082" class="service-small">NodeManager</text>
  <text x="41" y="1100" class="detail">Contenedores YARN · 2 vcores · 2560 MiB</text>

  <!-- Leyenda -->
  <text x="16" y="1150" class="detail-strong">YARN anuncia 2560 MiB; quedan 512 MiB sin anunciar</text>
  <text x="16" y="1168" class="detail">y procesos auxiliares; los contenedores YARN no son Docker.</text>
  <rect x="17" y="1191" width="14" height="14" rx="4" fill="#087e83"/>
  <text x="38" y="1203" class="legend">HDFS · almacenamiento</text>
  <rect x="198" y="1191" width="14" height="14" rx="4" fill="#b45a20"/>
  <text x="219" y="1203" class="legend">YARN · recursos y ejecución</text>
  <rect x="17" y="1220" width="15" height="13" rx="3" fill="#ffffff" stroke="#9aabba" stroke-width="1.3"/>
  <text x="39" y="1232" class="legend">Cada marco reúne los procesos de un contenedor Docker.</text>
</svg>
