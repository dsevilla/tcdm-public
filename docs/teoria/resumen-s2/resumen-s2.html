<li><strong>La capa <code>raw</code> en HDFS</strong>: directorios, marcadores <code>_SUCCESS</code> y tamaños</li>
<li><strong>DuckDB y las vistas temporales</strong>: consultar Parquet como si fueran tablas</li>
<li><strong>Las tablas principales</strong>: hechos, dimensiones y claves</li>
<li><strong>Versiones con doble fecha</strong>: qué fila estaba vigente cada día</li>
<li><strong>Cuatro consultas</strong> que volveremos a ver en S3</li>
</ul>

<h1 id="data-lake-y-medallion">Data lake y medallion</h1>
<p>Dónde se guardan los datos y cómo se ordenan</p>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-theme="tcdm" data-lang="es" lang="es" data-marpit-pagination="4" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="data-lake-frente-a-data-warehouse">Data lake frente a data warehouse</h1>
<ul>
<li><strong>Warehouse</strong>: el esquema se define antes de cargar (<em>schema-on-write</em>); sólo entra lo que encaja en las tablas diseñadas</li>
<li><strong>Data lake</strong>: los ficheros se guardan como llegan, en un almacenamiento distribuido (HDFS, S3…), y el esquema se interpreta al leer (<em>schema-on-read</em>)
<ul>
<li>Se conserva el dato original y se puede <strong>reprocesar</strong> todo el histórico</li>
<li>Se incorporan fuentes distintas sin negociar antes un esquema común</li>
</ul>
</li>
<li>El riesgo: un <em><strong>data swamp</strong></em>, donde nadie sabe qué fichero es fiable</li>
</ul>
<blockquote>
<p>La arquitectura <strong>medallion</strong> ordena el lake en capas, cada una con un contrato sobre lo que contiene</p>
</blockquote>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="dense" data-theme="tcdm" data-lang="es" lang="es" class="dense" data-marpit-pagination="5" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:dense;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="las-tres-capas">Las tres capas</h1>
<table>
<thead>
<tr>
<th>Capa</th>
<th>Qué guarda</th>
<th>Cómo se llega</th>
<th>Para qué sirve</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>raw</code> (<em>bronze</em>)</td>
<td>La fuente tal como llega</td>
<td>Copia o conversión de formato</td>
<td>Reprocesar sin volver a la fuente</td>
</tr>
<tr>
<td><code>silver</code></td>
<td>Datos validados, tipados, sin duplicados, unidos entre fuentes</td>
<td>Limpieza y <code>JOIN</code></td>
<td>Base común para muchos consumidores</td>
</tr>
<tr>
<td><code>gold</code></td>
<td>Agregados para una pregunta de negocio</td>
<td>Agregación sobre <code>silver</code></td>
<td>Cuadros de mando, informes, modelos</td>
</tr>
</tbody>
</table>
<ul>
<li>En el curso, <code>raw</code> es <strong>el punto de partida</strong>: el CSV del IGN tal cual y las tablas TPC-DS ya adaptadas, que tomamos como datos originales</li>
<li>S2 escribe <code>raw</code>; <code>silver</code> y <code>gold</code> llegarán en la sesión 5</li>
<li>No es una jerarquía obligatoria, sino un <strong>compromiso de calidad</strong>: se puede leer <code>raw</code> para explorar</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="figure-only" data-theme="tcdm" data-lang="es" lang="es" class="figure-only" data-marpit-pagination="6" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:figure-only;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">

<h1 id="el-dataset">El dataset</h1>
<p>TPC-DS SF3, generado y adaptado con DuckDB</p>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="compact" data-theme="tcdm" data-lang="es" lang="es" class="compact" data-marpit-pagination="8" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:compact;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="tpc-ds-sf3">TPC-DS SF3</h1>
<ul>
<li>Benchmark de apoyo a la decisión: una cadena <strong>minorista</strong> que vende en tienda, por catálogo y por web</li>
<li><strong>Dimensiones</strong> (clientes, productos, tiendas…) y <strong>hechos</strong> (ventas, devoluciones, inventario), unidos por claves <code>_sk</code></li>
<li>El curso usa <strong>18 tablas</strong></li>
<li><strong>SF3</strong> ≈ 3 GB sin comprimir → unos <strong>545 MiB en Parquet</strong> (1,6 GiB con las tres réplicas de HDFS) y unos <strong>42 millones de filas</strong></li>
<li>Determinista: con la misma versión de DuckDB, todo el mundo obtiene las mismas filas</li>
</ul>
<blockquote>
<p>El generador <code>dsdgen</code> viene como <strong>extensión</strong> de DuckDB: <code>INSTALL tpcds; LOAD tpcds; CALL dsdgen(sf = 3)</code></p>
</blockquote>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="9" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="la-ruta-de-los-datos">La ruta de los datos</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">dsdgen (extensión tpcds de DuckDB)       CSV del IGN (MUNICIPIOS.csv.gz)
          │                                       │ read_csv y normalización
          ▼                                       ▼
base DuckDB temporal en namenode  ◄──────  tabla ign_municipios
          │
          │ JOIN determinista, fechas y vigencias corregidas
          │ COPY (SELECT …) TO &#x27;hdfs://…&#x27; (FORMAT PARQUET, COMPRESSION ZSTD)
          ▼
HDFS /datalake/raw/tpcds/&lt;tabla&gt;/&lt;tabla&gt;.parquet
</code></pre>
<ul>
<li>DuckDB es una base de datos <strong>embebida</strong>: una biblioteca dentro del proceso de Python, sin servidor</li>
<li>La base temporal se <strong>borra</strong> al terminar: lo que queda está en HDFS</li>
<li>DuckDB escribe en HDFS mediante <code>hdfs-native</code>, un cliente de HDFS sin Java</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="section-divider" data-theme="tcdm" data-lang="es" lang="es" class="section-divider" data-marpit-pagination="10" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:section-divider;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="los-municipios-de-espa%C3%B1a">Los municipios de España</h1>
<p>Una segunda fuente, real, cruzada con la sintética</p>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="11" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="el-nomencl%C3%A1tor-del-ign">El Nomenclátor del IGN</h1>
<p><strong>8.132 municipios</strong> con provincia, población, superficie, coordenadas y altitud (NGMEP CC-BY 4.0 ign.es)</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> read_csv(<span class="hljs-string">&#x27;MUNICIPIOS.csv.gz&#x27;</span>,
    delim <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;;&#x27;</span>,                  <span class="hljs-comment">-- la coma es el separador decimal</span>
    encoding <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;latin-1&#x27;</span>,         <span class="hljs-comment">-- no es UTF-8: «Araba/�lava»</span>
    decimal_separator <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;,&#x27;</span>,      <span class="hljs-comment">-- 1994,5872</span>
    types <span class="hljs-operator">=</span> {<span class="hljs-string">&#x27;COD_INE&#x27;</span>: <span class="hljs-string">&#x27;VARCHAR&#x27;</span>, <span class="hljs-string">&#x27;COD_PROV&#x27;</span>: <span class="hljs-string">&#x27;VARCHAR&#x27;</span>})  <span class="hljs-comment">-- conservar los ceros iniciales</span>
</code></pre>
<ul>
<li>Antes de leer un CSV público hay que <strong>mirar sus bytes</strong>: separador, codificación, decimales y códigos</li>
<li>Se valida: 8.132 municipios únicos, provincias <code>01</code>–<code>52</code>, coordenadas dentro de España</li>
<li>El CSV se guarda <strong>tal cual</strong>, en <code>/datalake/raw/ign/municipios</code></li>
</ul>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="12" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="un-join-determinista">Un <code>JOIN</code> determinista</h1>
<p>Cada pareja ciudad–estado de TPC-DS elige siempre el mismo municipio:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">JOIN</span> ign_municipios_ordenados <span class="hljs-keyword">AS</span> ign
  <span class="hljs-keyword">ON</span> ign.posicion <span class="hljs-operator">=</span> <span class="hljs-number">1</span> <span class="hljs-operator">+</span> md5_number(
      concat(customer_address.ca_city, <span class="hljs-string">&#x27;|&#x27;</span>, customer_address.ca_state)
  ) <span class="hljs-operator">%</span> <span class="hljs-number">8132</span>
</code></pre>
<ul>
<li><code>posicion</code> numera los municipios del 1 al 8.132, sin huecos</li>
<li><strong>No se usa <code>random()</code></strong>: repetir la generación da el mismo resultado en cualquier equipo</li>
<li><code>concat</code> trata <code>NULL</code> como cadena vacía; con <code>||</code> la fila perdería el <code>JOIN</code></li>
<li>Se sustituyen <code>*_city</code> → municipio, <code>*_county</code> → provincia, <code>*_state</code> → código de provincia y <code>*_country</code> → <code>España</code></li>
<li>Calles, códigos postales y husos horarios <strong>siguen siendo sintéticos</strong>: el IGN no los aporta</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="section-divider" data-theme="tcdm" data-lang="es" lang="es" class="section-divider" data-marpit-pagination="13" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:section-divider;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="la-capa-raw-en-hdfs">La capa <code>raw</code> en HDFS</h1>
<p>Qué ha quedado escrito y cómo comprobarlo</p>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="14" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="un-directorio-por-tabla">Un directorio por tabla</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">/datalake/raw/
├── ign/municipios/MUNICIPIOS.csv.gz
└── tpcds/
    ├── customer/       customer.parquet          _SUCCESS  (vacío)
    ├── customer_address/ customer_address.parquet  _SUCCESS  INE-2026
    ├── item/           item.parquet              _SUCCESS  SCD2
    ├── store/          store.parquet             _SUCCESS  INE-2026+SCD2+FECHAS
    ├── store_sales/    store_sales.parquet       _SUCCESS  SCD2+FECHAS
    └── …               (18 tablas)
</code></pre>
<ul>
<li>Una <strong>tabla es un directorio</strong>, no un fichero: Spark escribirá varios ficheros en el mismo directorio</li>
<li>El formato se reconoce por la firma <code>PAR1</code> del fichero, no por la extensión</li>
<li><code>hdfs dfs -du -h</code> da dos tamaños: el <strong>lógico</strong> y el <strong>ocupado con réplicas</strong> (×3)</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="section-divider" data-theme="tcdm" data-lang="es" lang="es" class="section-divider" data-marpit-pagination="15" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:section-divider;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="duckdb-y-las-vistas-temporales">DuckDB y las vistas temporales</h1>
<p>De ficheros a tablas con nombre</p>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="16" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="una-vista-por-tabla">Una vista por tabla</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">duckdb.register_filesystem(ThreadSafeHdfs(host=<span class="hljs-string">&quot;namenode&quot;</span>, port=<span class="hljs-number">9000</span>),
                           connection=connection)

<span class="hljs-keyword">def</span> <span class="hljs-title function_">create_view</span>(<span class="hljs-params">table: <span class="hljs-built_in">str</span></span>) -&gt; <span class="hljs-literal">None</span>:
    url_list = <span class="hljs-string">&quot;, &quot;</span>.join(<span class="hljs-string">f&quot;&#x27;<span class="hljs-subst">{url}</span>&#x27;&quot;</span> <span class="hljs-keyword">for</span> url <span class="hljs-keyword">in</span> table_urls(table))   <span class="hljs-comment"># sin _SUCCESS</span>
    connection.execute(
        <span class="hljs-string">f&quot;CREATE OR REPLACE VIEW <span class="hljs-subst">{table}</span> AS SELECT * FROM read_parquet([<span class="hljs-subst">{url_list}</span>])&quot;</span>)

create_view(<span class="hljs-string">&quot;web_sales&quot;</span>)
connection.sql(<span class="hljs-string">&quot;SELECT count(*) FROM web_sales&quot;</span>)       <span class="hljs-comment"># 2.160.165 filas</span>
</code></pre>
<ul>
<li><code>register_filesystem</code> le da a DuckDB el sistema de ficheros de <code>fsspec</code> para leer URL <code>hdfs://</code></li>
<li>La lista excluye <code>_SUCCESS</code>: no es un Parquet y DuckDB fallaría al leerlo</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="compact" data-theme="tcdm" data-lang="es" lang="es" class="compact" data-marpit-pagination="17" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:compact;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="qu%C3%A9-es-una-vista-y-qu%C3%A9-no">Qué es una vista (y qué no)</h1>
<ul>
<li>Una vista guarda la <strong>consulta</strong>, no los datos: no copia nada</li>
<li>Cada consulta sobre <code>web_sales</code> <strong>vuelve a leer</strong> los Parquet de HDFS (aunque DuckDB es muy eficiente con las cachés)</li>
<li>Desaparece al cerrar la conexión: es temporal</li>
<li>Las consultas se escriben como con tablas normales: <code>FROM web_sales</code></li>
<li>PyArrow, Polars y DuckDB leyeron <code>item</code> y coincidieron en filas, no nulos, mínimo, máximo y suma de <code>i_item_sk</code></li>
</ul>
<blockquote>
<p>En <strong>S3</strong> sólo cambian las URL (<code>s3://tcdm-datalake/raw/tpcds/…</code>) y DuckDB las lee con <code>httpfs</code>. En <strong>S6</strong> la tabla tendrá un nombre en el catálogo: <code>tcdm.web_sales</code></p>
</blockquote>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="section-divider" data-theme="tcdm" data-lang="es" lang="es" class="section-divider" data-marpit-pagination="18" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:section-divider;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="las-tablas-principales">Las tablas principales</h1>
<p>Hechos, dimensiones y claves</p>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="two-columns" data-theme="tcdm" data-lang="es" lang="es" class="two-columns" data-marpit-pagination="19" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:two-columns;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="un-hecho-rodeado-de-dimensiones">Un hecho rodeado de dimensiones</h1>
<div class="columns">
<div class="column wide">
<p><img src="https://dsevilla.github.io/tcdm-public/figs/tpcds_er_web_sales.svg" alt="Diagrama entidad-relación de web_sales con sus dimensiones" /></p>
</div>
<div class="column narrow">
<ul>
<li>El <strong>prefijo</strong> dice de qué tabla es una columna: <code>ws_</code> es <code>web_sales</code>, <code>c_</code> es <code>customer</code>…</li>
<li>Las columnas <code>_sk</code> son <strong>claves</strong>: la propia o la que apunta a otra tabla</li>
<li>Un hecho son casi todo claves, más cantidades e importes</li>
<li>Las claves ajenas son <strong>lógicas</strong>: Parquet no las impone</li>
</ul>
</div>
</div>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="dense" data-theme="tcdm" data-lang="es" lang="es" class="dense" data-marpit-pagination="20" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:dense;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="las-tablas-que-m%C3%A1s-usaremos">Las tablas que más usaremos</h1>
<table>
<thead>
<tr>
<th>Tabla</th>
<th>Una fila es…</th>
<th>Columnas para recordar</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>web_sales</code></td>
<td>una línea de un pedido web</td>
<td><code>ws_order_number</code>, <code>ws_item_sk</code>, <code>ws_bill_customer_sk</code>, <code>ws_bill_addr_sk</code>, <code>ws_sold_timestamp</code></td>
</tr>
<tr>
<td><code>store_sales</code></td>
<td>una línea de un ticket de tienda</td>
<td><code>ss_ticket_number</code>, <code>ss_item_sk</code>, <code>ss_customer_sk</code>, <code>ss_store_sk</code>, <code>ss_sold_timestamp</code></td>
</tr>
<tr>
<td><code>item</code></td>
<td>una <strong>versión</strong> de un producto</td>
<td><code>i_item_sk</code>, <code>i_item_id</code>, <code>i_product_name</code>, <code>i_category</code></td>
</tr>
<tr>
<td><code>customer</code></td>
<td>un cliente</td>
<td><code>c_customer_sk</code>, <code>c_first_name</code>, <code>c_last_name</code>, <code>c_current_addr_sk</code></td>
</tr>
<tr>
<td><code>customer_address</code></td>
<td>un domicilio</td>
<td><code>ca_address_sk</code>, <code>ca_city</code> (municipio), <code>ca_county</code> (provincia), <code>ca_state</code> (código)</td>
</tr>
</tbody>
</table>
<ul>
<li><strong>Una fila de un hecho es una línea, no un pedido</strong>: <code>count(*)</code> cuenta líneas y <code>count(DISTINCT ws_order_number)</code> cuenta pedidos</li>
<li>Las medidas tienen el mismo nombre en todas las sesiones: <code>lineas_de_venta</code>, <code>pedidos</code>, <code>tickets</code>, <code>unidades</code>, <code>ventas</code>, <code>beneficio_neto</code></li>
</ul>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="21" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="una-venta-clave-a-clave">Una venta, clave a clave</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> web_sales.ws_order_number,
       item.i_product_name <span class="hljs-keyword">AS</span> producto,
       customer.c_first_name <span class="hljs-operator">||</span> <span class="hljs-string">&#x27; &#x27;</span> <span class="hljs-operator">||</span> customer.c_last_name <span class="hljs-keyword">AS</span> cliente,
       customer_address.ca_city <span class="hljs-keyword">AS</span> municipio,
       <span class="hljs-built_in">CAST</span>(web_sales.ws_sold_timestamp <span class="hljs-keyword">AS</span> <span class="hljs-type">DATE</span>) <span class="hljs-keyword">AS</span> fecha
<span class="hljs-keyword">FROM</span> web_sales
<span class="hljs-keyword">JOIN</span> item             <span class="hljs-keyword">ON</span> web_sales.ws_item_sk <span class="hljs-operator">=</span> item.i_item_sk
<span class="hljs-keyword">JOIN</span> customer         <span class="hljs-keyword">ON</span> web_sales.ws_bill_customer_sk <span class="hljs-operator">=</span> customer.c_customer_sk
<span class="hljs-keyword">JOIN</span> customer_address <span class="hljs-keyword">ON</span> web_sales.ws_bill_addr_sk <span class="hljs-operator">=</span> customer_address.ca_address_sk
<span class="hljs-keyword">WHERE</span> web_sales.ws_order_number <span class="hljs-operator">=</span> <span class="hljs-number">1</span>
</code></pre>
<ul>
<li>El patrón de toda consulta analítica: <strong>un hecho y un <code>JOIN</code> por dimensión</strong></li>
<li>Hay dos caminos a un lugar: el domicilio de facturación del pedido (<code>ws_bill_addr_sk</code>) y el actual del cliente (<code>c_current_addr_sk</code>). No coinciden: hay que decir cuál se usa</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="section-divider" data-theme="tcdm" data-lang="es" lang="es" class="section-divider" data-marpit-pagination="22" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:section-divider;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="versiones-con-doble-fecha">Versiones con doble fecha</h1>
<p>Dimensiones que guardan su historia</p>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="compact" data-theme="tcdm" data-lang="es" lang="es" class="compact" data-marpit-pagination="23" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:compact;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="una-fila-por-versi%C3%B3n-scd-2">Una fila por versión (SCD 2)</h1>
<ul>
<li><code>item</code>, <code>store</code>, <code>web_page</code> y <code>web_site</code> guardan <strong>una fila por versión</strong> de cada objeto: si cambia el precio, se añade una fila y la anterior se cierra
<ul>
<li><code>_sk</code>: clave de <strong>la versión</strong>; es la que guardan las ventas</li>
<li><code>_id</code>: clave de negocio, <strong>la misma</strong> en todas las versiones</li>
<li><code>rec_start_date</code> y <code>rec_end_date</code>: primer y último día de vigencia; <code>rec_end_date</code> es <code>NULL</code> en la <strong>versión vigente</strong></li>
</ul>
</li>
<li>Los periodos de un objeto se suceden <strong>sin solaparse</strong></li>
<li>Una venta queda enlazada al producto tal como era <strong>el día en que se hizo</strong></li>
</ul>
<blockquote>
<p>Es una <em>slowly changing dimension</em> de tipo 2 (SCD 2)</p>
</blockquote>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-scope-qn4KkipL="" data-class="figure-only" data-theme="tcdm" data-lang="es" lang="es" class="figure-only" style="--class:figure-only;--theme:tcdm;--lang:es;" data-size="16:9">
<p><img src="https://dsevilla.github.io/tcdm-public/figs/tpcds_versiones_item_store.svg" alt="Seis primeras filas de item y store como tablas de versiones, con sus periodos de vigencia" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="25" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="consultar-con-la-doble-fecha">Consultar con la doble fecha</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- Sólo la versión vigente de cada producto</span>
<span class="hljs-keyword">WHERE</span> i_rec_end_date <span class="hljs-keyword">IS</span> <span class="hljs-keyword">NULL</span>

<span class="hljs-comment">-- La versión que estaba vigente un día concreto</span>
<span class="hljs-keyword">WHERE</span> <span class="hljs-type">DATE</span> <span class="hljs-string">&#x27;2000-06-15&#x27;</span> <span class="hljs-keyword">BETWEEN</span> i_rec_start_date
                            <span class="hljs-keyword">AND</span> <span class="hljs-built_in">coalesce</span>(i_rec_end_date, <span class="hljs-type">DATE</span> <span class="hljs-string">&#x27;9999-12-31&#x27;</span>)
</code></pre>
<ul>
<li>Contar filas de <code>item</code> <strong>no es contar productos</strong>: <code>count(DISTINCT i_item_id)</code></li>
<li>Agrupar por <code>i_item_sk</code> separa las versiones; por <code>i_item_id</code> las reúne</li>
<li>El generador fechaba mal las versiones (entre 66 y 294 días de adelanto) y <code>store_sales</code> apuntaba siempre a la primera versión de la tienda. S2 lo corrige al escribir</li>
<li>Comprobación final: <strong>0 líneas de venta</strong> apuntan a una versión fuera de su vigencia</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="section-divider" data-theme="tcdm" data-lang="es" lang="es" class="section-divider" data-marpit-pagination="26" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:section-divider;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="cuatro-consultas">Cuatro consultas</h1>
<p>Las mismas que repetiremos en S3 sobre el almacén de objetos</p>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="27" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="1-%C2%BFqu%C3%A9-cliente-ha-hecho-m%C3%A1s-pedidos">1. ¿Qué cliente ha hecho más pedidos?</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> customer.c_customer_id,
       concat_ws(<span class="hljs-string">&#x27; &#x27;</span>, customer.c_first_name, customer.c_last_name) <span class="hljs-keyword">AS</span> cliente,
       <span class="hljs-built_in">count</span>(<span class="hljs-keyword">DISTINCT</span> web_sales.ws_order_number) <span class="hljs-keyword">AS</span> pedidos,
       <span class="hljs-built_in">sum</span>(web_sales.ws_ext_sales_price) <span class="hljs-keyword">AS</span> ventas
<span class="hljs-keyword">FROM</span> web_sales
<span class="hljs-keyword">JOIN</span> customer <span class="hljs-keyword">ON</span> web_sales.ws_bill_customer_sk <span class="hljs-operator">=</span> customer.c_customer_sk
<span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> customer.c_customer_id, customer.c_first_name, customer.c_last_name
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> pedidos <span class="hljs-keyword">DESC</span>, customer.c_customer_id
LIMIT <span class="hljs-number">10</span>
</code></pre>
<ul>
<li><code>count(DISTINCT ws_order_number)</code> cuenta <strong>pedidos</strong>; con <code>count(*)</code> serían líneas y el orden cambia</li>
<li><code>concat_ws</code> no devuelve <code>NULL</code> si falta el nombre o el apellido, a diferencia de <code>||</code></li>
<li>El <code>ORDER BY</code> desempata por la clave: el resultado es repetible</li>
<li>¿El cliente con más pedidos es el que más ha gastado?</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="28" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="2-%C2%BFde-qu%C3%A9-provincia-salen-m%C3%A1s-pedidos">2. ¿De qué provincia salen más pedidos?</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> customer_address.ca_state <span class="hljs-keyword">AS</span> provincia_id,
       customer_address.ca_county <span class="hljs-keyword">AS</span> provincia,
       <span class="hljs-built_in">count</span>(<span class="hljs-keyword">DISTINCT</span> web_sales.ws_order_number) <span class="hljs-keyword">AS</span> pedidos,
       <span class="hljs-built_in">sum</span>(web_sales.ws_ext_sales_price) <span class="hljs-keyword">AS</span> ventas
<span class="hljs-keyword">FROM</span> web_sales
<span class="hljs-keyword">JOIN</span> customer_address
    <span class="hljs-keyword">ON</span> web_sales.ws_bill_addr_sk <span class="hljs-operator">=</span> customer_address.ca_address_sk
<span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> customer_address.ca_state, customer_address.ca_county
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> pedidos <span class="hljs-keyword">DESC</span>, provincia_id
LIMIT <span class="hljs-number">10</span>
</code></pre>
<ul>
<li>Aquí se ve el cruce con el IGN: <code>ca_county</code> y <code>ca_state</code> son provincias españolas</li>
<li>El <code>JOIN</code> va por la <strong>clave</strong> de dirección, no por nombres: los nombres sólo describen el resultado</li>
<li>Las ventas son sintéticas y el reparto de municipios no sigue la población real</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="29" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="3-%C2%BFc%C3%B3mo-se-reparten-las-ventas-por-mes">3. ¿Cómo se reparten las ventas por mes?</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-keyword">month</span>(ss_sold_timestamp) <span class="hljs-keyword">AS</span> mes,
       <span class="hljs-built_in">count</span>(<span class="hljs-keyword">DISTINCT</span> ss_ticket_number) <span class="hljs-keyword">AS</span> tickets,
       <span class="hljs-built_in">sum</span>(ss_quantity) <span class="hljs-keyword">AS</span> unidades,
       <span class="hljs-built_in">sum</span>(ss_ext_sales_price) <span class="hljs-keyword">AS</span> ventas
<span class="hljs-keyword">FROM</span> store_sales
<span class="hljs-keyword">WHERE</span> <span class="hljs-keyword">year</span>(ss_sold_timestamp) <span class="hljs-keyword">BETWEEN</span> <span class="hljs-number">1998</span> <span class="hljs-keyword">AND</span> <span class="hljs-number">2002</span>
<span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> mes
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> mes
</code></pre>
<ul>
<li><code>month()</code> sale de la marca de tiempo: no hace falta <code>JOIN</code> con un calendario</li>
<li>En tienda se cuentan <strong>tickets</strong> distintos, el equivalente al pedido web</li>
<li>El filtro deja sólo años completos: 2003 sólo tiene sus primeros días y se sumaría a enero</li>
<li>¿Se reparten las ventas por igual a lo largo del año?</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="30" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="4-%C2%BFqu%C3%A9-producto-se-vende-m%C3%A1s-cada-mes">4. ¿Qué producto se vende más cada mes?</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">WITH</span> unidades_por_mes <span class="hljs-keyword">AS</span> (
    <span class="hljs-keyword">SELECT</span> <span class="hljs-keyword">month</span>(store_sales.ss_sold_timestamp) <span class="hljs-keyword">AS</span> mes, item.i_item_sk,
           item.i_product_name <span class="hljs-keyword">AS</span> producto, <span class="hljs-built_in">sum</span>(store_sales.ss_quantity) <span class="hljs-keyword">AS</span> unidades
    <span class="hljs-keyword">FROM</span> store_sales
    <span class="hljs-keyword">JOIN</span> item <span class="hljs-keyword">ON</span> store_sales.ss_item_sk <span class="hljs-operator">=</span> item.i_item_sk
    <span class="hljs-keyword">WHERE</span> <span class="hljs-keyword">year</span>(store_sales.ss_sold_timestamp) <span class="hljs-keyword">BETWEEN</span> <span class="hljs-number">1998</span> <span class="hljs-keyword">AND</span> <span class="hljs-number">2002</span>
    <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> mes, item.i_item_sk, item.i_product_name
),
clasificados <span class="hljs-keyword">AS</span> (
    <span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span>, <span class="hljs-built_in">row_number</span>() <span class="hljs-keyword">OVER</span> (<span class="hljs-keyword">PARTITION</span> <span class="hljs-keyword">BY</span> mes
                                 <span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> unidades <span class="hljs-keyword">DESC</span>, i_item_sk) <span class="hljs-keyword">AS</span> posición
    <span class="hljs-keyword">FROM</span> unidades_por_mes
)
<span class="hljs-keyword">SELECT</span> mes, producto, unidades <span class="hljs-keyword">FROM</span> clasificados <span class="hljs-keyword">WHERE</span> posición <span class="hljs-operator">=</span> <span class="hljs-number">1</span> <span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> mes
</code></pre>
<footer>TCDM · Curso 2026/2027 · Resumen de la sesión 2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Resumen de la sesión 2" data-class="compact" data-theme="tcdm" data-lang="es" lang="es" class="compact" data-marpit-pagination="31" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Resumen de la sesión 2;--class:compact;--theme:tcdm;--lang:es;" data-marpit-pagination-total="32" data-size="16:9">
<h1 id="%C2%ABel-m%C3%A1s-vendido-de-cada-grupo%C2%BB">«El más vendido de cada grupo»</h1>
<ul>
<li>Un <code>GROUP BY</code> con <code>LIMIT</code> no basta: el <code>LIMIT</code> corta el resultado entero, no cada mes</li>
<li>Se resuelve en tres pasos, uno por bloque:
<ol>
<li><strong>Agregar</strong>: unidades de cada producto en cada mes</li>
<li><strong>Numerar</strong> dentro de cada mes: <code>row_number() OVER (PARTITION BY mes ORDER BY unidades DESC)</code></li>
<li><strong>Filtrar</strong> la posición 1 en una consulta exterior</li>
</ol>
</li>

<h1 id="lo-que-hay-que-llevarse-de-s2">Lo que hay que llevarse de S2</h1>
<ul>
<li><code>/datalake/raw</code> es el punto de partida: 18 tablas TPC-DS adaptadas y el CSV del IGN</li>
<li>Una tabla es un <strong>directorio de Parquet</strong>; <code>_SUCCESS</code> dice que está completa y con qué correcciones</li>
<li>DuckDB consulta esos ficheros con SQL dentro de Python; una <strong>vista</strong> les da nombre sin copiar datos</li>
<li>Los hechos son líneas: cuidado con <code>count(*)</code></li>
<li>Las dimensiones con versiones se enlazan por <code>_sk</code> y se agrupan por <code>_id</code></li>
<li>Todo ocurre <strong>en un solo proceso</strong> dentro de <code>namenode</code>: aún no hay cálculo distribuido</li>
</ul>
