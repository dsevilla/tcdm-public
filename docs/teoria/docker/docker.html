<table>
<thead>
<tr>
<th>Orden (en el equipo)</th>
<th>Compose que ejecuta</th>
<th>Qué se conserva</th>
<th>Qué se pierde</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>make -C entorno stop</code></td>
<td><code>stop</code></td>
<td>Todo, incluido el interior de cada contenedor</td>
<td>Nada (Jupyter hay que lanzarlo de nuevo)</td>
</tr>
<tr>
<td><code>make -C entorno down</code></td>
<td><code>down</code></td>
<td>Volúmenes: HDFS, metadatos del Hive Metastore, objetos de S3</td>
<td>Capa de escritura de los contenedores (<code>/tmp</code>, registros, Timeline Server)</td>
</tr>
<tr>
<td><code>make -C entorno clean</code></td>
<td><code>down -v</code> (salvo Hadoop: <code>down</code>)</td>
<td>Sólo HDFS</td>
<td>Hive Metastore y S3</td>
</tr>
<tr>
<td><code>make -C entorno clean-hdfs</code></td>
<td><code>clean</code> + <code>docker volume rm</code> de los cuatro volúmenes HDFS</td>
<td>Nada</td>
<td><strong>Todos los datos</strong>, incluido <code>/datalake</code></td>
</tr>
</tbody>
</table>
<ul>
<li>Después de cualquiera: <code>make -C entorno hadoop-up</code> (y <code>s3-up</code> si lo usas)</li>
<li><code>make -C entorno status</code>: <code>ps -a</code> de cada Compose presente</li>
<li><code>make -C entorno jupyter</code>: atajo de <code>docker exec -it namenode su - luser -c 'jupyter lab ...'</code></li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="51" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="ver-qu%C3%A9-har%C3%ADa-make-sin-ejecutarlo">Ver qué haría <code>make</code> sin ejecutarlo</h1>
<p><code>make -n</code> imprime las órdenes de un objetivo <strong>sin ejecutarlas</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># equipo</span>
make -n -C entorno clean-hdfs
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">if test -e compose-trino.yml; then docker compose -f compose-trino.yml down -v; fi
if test -e compose-s3.yml; then docker compose -f compose-s3.yml down -v; fi
if test -e compose-warehouse-hdfs.yml; then docker compose -f ... down -v; fi
docker compose -f compose-hadoop-cluster.yml down
docker volume rm -f tcdm-26-27-namenode-data tcdm-26-27-datanode1-data ...
</code></pre>
<ul>
<li>El Compose de Hadoop se baja <strong>sin</strong> <code>-v</code> en <code>clean</code>: sus volúmenes sólo los borra <code>clean-hdfs</code>, de forma explícita</li>
<li>Los <code>if test -e</code> permiten que el <code>Makefile</code> funcione aunque aún no tengas los Compose de sesiones posteriores</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="section-divider" data-theme="tcdm" data-lang="es" lang="es" class="section-divider" data-marpit-pagination="52" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:section-divider;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="ver-c%C3%B3mo-est%C3%A1-el-sistema">Ver cómo está el sistema</h1>
<p>Diagnóstico de fuera hacia dentro</p>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-theme="tcdm" data-lang="es" lang="es" data-marpit-pagination="53" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="de-fuera-hacia-dentro">De fuera hacia dentro</h1>
<ol>
<li><strong>¿Responde Docker?</strong> <code>docker info</code> (si no: arranca Docker Desktop o el servicio)</li>
<li><strong>¿Existen y están en marcha los contenedores?</strong> <code>make -C entorno status</code></li>
<li><strong>¿Qué consumen?</strong> <code>docker stats --no-stream</code></li>
<li><strong>¿Arrancó bien el proceso inicial?</strong> <code>docker logs namenode</code></li>
<li><strong>¿Están vivos los demonios?</strong> <code>docker exec namenode su - hdadmin -c jps</code></li>
<li><strong>¿Funciona Hadoop?</strong> <code>hdfs dfsadmin -report</code>, <code>yarn node -list -all</code></li>
<li><strong>¿Qué dicen los registros de Hadoop?</strong> <code>/opt/bd/hadoop/logs/</code></li>
</ol>
<blockquote>
<p>Cada paso sólo tiene sentido si el anterior está bien: un <code>jps</code> vacío no se arregla repitiendo celdas de HDFS</p>
</blockquote>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="54" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="estado-y-consumo-de-los-contenedores">Estado y consumo de los contenedores</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># equipo</span>
make -C entorno status
docker stats --no-stream namenode datanode1 datanode2 datanode3
docker compose -f entorno/compose-hadoop-cluster.yml top namenode
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">NAME        CPU %   MEM USAGE / LIMIT     MEM %
namenode    1.52%   1.31GiB / 4GiB        32.8%
datanode1   0.61%   612MiB / 3GiB         19.9%
...
</code></pre>
<p>(columnas y valores de ejemplo: dependen de lo que esté ejecutando el clúster)</p>
<ul>
<li><code>LIMIT</code> es el <code>mem_limit</code> del Compose; si un contenedor lo supera, el núcleo mata un proceso y el contenedor puede acabar en <code>Exited (137)</code></li>
<li><code>top</code> muestra <code>tini</code>, <code>tail</code> y una JVM por demonio de Hadoop</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="55" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="docker-inspect-toda-la-configuraci%C3%B3n-de-un-contenedor"><code>docker inspect</code>: toda la configuración de un contenedor</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># equipo</span>
docker inspect namenode --format <span class="hljs-string">&#x27;{{.State.Status}} desde {{.State.StartedAt}}&#x27;</span>
docker inspect namenode --format <span class="hljs-string">&#x27;{{.State.ExitCode}} OOM={{.State.OOMKilled}}&#x27;</span>
docker inspect namenode --format <span class="hljs-string">&#x27;{{.HostConfig.NanoCpus}} {{.HostConfig.Memory}}&#x27;</span>
<span class="hljs-comment"># 2000000000 4294967296      ← cpus: 2.0 y mem_limit: 4096m</span>
docker inspect namenode \
  --format <span class="hljs-string">&#x27;{{range .Mounts}}{{.Name}} -&gt; {{.Destination}}{{&quot;\n&quot;}}{{end}}&#x27;</span>
<span class="hljs-comment"># tcdm-26-27-namenode-data -&gt; /var/data/hdfs/namenode</span>
</code></pre>
<ul>
<li><code>OOMKilled=true</code> confirma que el contenedor se quedó sin memoria</li>
<li>Sin <code>--format</code>, <code>inspect</code> muestra el JSON completo: <code>Config</code>, <code>State</code>, <code>Mounts</code>, <code>NetworkSettings</code>, <code>HostConfig</code></li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="56" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="qu%C3%A9-se-perder%C3%ADa-con-un-down-docker-diff">Qué se perdería con un <code>down</code>: <code>docker diff</code></h1>
<p><code>docker diff</code> lista lo que ha cambiado en la <strong>capa de escritura</strong> respecto a la imagen (<code>A</code> añadido, <code>C</code> cambiado, <code>D</code> borrado):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># equipo</span>
docker diff namenode | <span class="hljs-built_in">head</span> -20
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">C /opt/bd/hadoop-3.5.0/logs
A /opt/bd/hadoop-3.5.0/logs/hadoop-hdadmin-namenode-namenode.log
A /opt/bd/hadoop-3.5.0/logs/hadoop-hdadmin-resourcemanager-namenode.log
C /tmp
A /tmp/hadoop-hdadmin-namenode.pid
C /var/data/yarn/timeline
...
</code></pre>
<p>(salida abreviada; <code>/opt/bd/hadoop</code> es un enlace a <code>/opt/bd/hadoop-3.5.0</code>)</p>
<ul>
<li>No aparece <code>/var/data/hdfs/namenode</code>: es un volumen, no la capa de escritura</li>
<li>Todo lo que sí aparece desaparece con <code>down</code> y se conserva con <code>stop</code></li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="57" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="los-registros-de-hadoop">Los registros de Hadoop</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># equipo</span>
docker <span class="hljs-built_in">exec</span> namenode <span class="hljs-built_in">ls</span> /opt/bd/hadoop/logs/
docker <span class="hljs-built_in">exec</span> namenode sh -c <span class="hljs-string">&#x27;tail -n 40 /opt/bd/hadoop/logs/*-namenode-*.log&#x27;</span>
docker <span class="hljs-built_in">exec</span> datanode2 sh -c <span class="hljs-string">&#x27;grep -i -E &quot;error|exception&quot; /opt/bd/hadoop/logs/*-datanode-*.log | tail&#x27;</span>
</code></pre>
<ul>
<li>Un fichero por demonio y contenedor: <code>hadoop-&lt;usuario&gt;-&lt;demonio&gt;-&lt;host&gt;.log</code></li>
<li>Viven en la capa de escritura: se conservan con <code>stop</code> y se pierden con <code>down</code>; para un diagnóstico, míralos <strong>antes</strong> de recrear el contenedor</li>
<li>Los registros de las aplicaciones YARN (MapReduce, Spark) se consultan con <code>yarn logs -applicationId ...</code>, como se ve en S1</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="dense" data-theme="tcdm" data-lang="es" lang="es" class="dense" data-marpit-pagination="58" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:dense;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="s%C3%ADntomas-frecuentes">Síntomas frecuentes</h1>
<table>
<thead>
<tr>
<th>Síntoma</th>
<th>Qué mirar</th>
<th>Qué hacer</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Cannot connect to the Docker daemon</code></td>
<td><code>docker info</code></td>
<td>Arrancar Docker Desktop o el servicio Docker</td>
</tr>
<tr>
<td><code>port is already allocated</code></td>
<td><code>docker ps</code> (quién usa el puerto)</td>
<td>Parar ese contenedor o programa</td>
</tr>
<tr>
<td><code>network hadoop-cluster ... not found</code></td>
<td><code>docker network ls</code></td>
<td><code>make -C entorno network</code> (lo hace <code>hadoop-up</code>)</td>
</tr>
<tr>
<td>Un contenedor en <code>Exited (137)</code></td>
<td><code>docker inspect ... OOMKilled</code></td>
<td>Más memoria para Docker; parar servicios que no uses</td>
</tr>
<tr>
<td>Contenedores <code>running</code>, pero menos de 3 DataNodes en <code>dfsadmin -report</code></td>
<td><code>jps</code> y registro del DataNode</td>
<td>Esperar medio minuto; si sigue, leer <code>*-datanode-*.log</code></td>
</tr>
<tr>
<td><code>Incompatible clusterIDs</code> en un DataNode</td>
<td><code>VERSION</code> de los volúmenes</td>
<td>Los volúmenes HDFS no son del mismo formateo: se borraron por separado</td>
</tr>
<tr>
<td>Faltan datos de una sesión anterior</td>
<td><code>hdfs dfs -ls /datalake/...</code></td>
<td>Repetir el notebook de esa sesión</td>
</tr>
</tbody>
</table>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="section-divider" data-theme="tcdm" data-lang="es" lang="es" class="section-divider" data-marpit-pagination="59" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:section-divider;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="actividades">Actividades</h1>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="compact" data-theme="tcdm" data-lang="es" lang="es" class="compact" data-marpit-pagination="60" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:compact;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="actividades-sin-arrancar-el-cl%C3%BAster">Actividades sin arrancar el clúster</h1>
<ul>
<li>Con <code>docker image inspect</code>, averigua el <code>ENTRYPOINT</code>, la <code>CMD</code>, las variables de entorno y los puertos de <code>namenode-image</code> y <code>datanode-image</code>. ¿Qué diferencias hay y de qué línea del Dockerfile sale cada una?</li>
<li>Con <code>docker image history</code>, localiza la capa del entorno Python del NameNode. ¿Cuánto ocupa frente a la de Hadoop? ¿Por qué no está en la imagen de los DataNodes?</li>
<li>Abre una <em>shell</em> en un contenedor temporal de <code>datanode-image</code> (<code>docker run --rm -it ... bash</code>) y lee <code>/inicio.sh</code> y <code>yarn-site.xml</code>. ¿Qué memoria y cuántos vcores anuncia el NodeManager?</li>
<li>Ejecuta <code>make -n -C entorno clean</code> y explica cada línea: ¿qué volúmenes sobreviven y por qué el Compose de Hadoop no lleva <code>-v</code>?</li>
<li>Con <code>docker compose ... config</code>, comprueba qué valor final tienen <code>mem_limit</code> y <code>cpus</code>, y cambia la imagen del NameNode con la variable <code>NAMENODE_IMAGE</code> <strong>sin</strong> arrancar nada</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="compact" data-theme="tcdm" data-lang="es" lang="es" class="compact" data-marpit-pagination="61" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:compact;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="actividades-con-el-cl%C3%BAster-en-marcha">Actividades con el clúster en marcha</h1>
<ul>
<li>Desde <code>datanode1</code>, resuelve <code>namenode</code>, <code>resourcemanager</code> y <code>timelineserver</code>. ¿Por qué dan la misma dirección? ¿Qué cambia tras un <code>down</code> y un <code>hadoop-up</code>?</li>
<li>Ejecuta <code>docker diff namenode</code> antes y después de lanzar un trabajo MapReduce. Predice qué se perdería con <code>make -C entorno down</code> y compruébalo (los datos de HDFS deben seguir ahí)</li>
<li>Localiza en el volumen de <code>datanode1</code> los ficheros <code>blk_*</code> de un fichero tuyo y relaciónalos con <code>hdfs fsck &lt;ruta&gt; -files -blocks -locations</code></li>
<li>Para sólo un DataNode con <code>docker stop datanode3</code>. Observa con <code>hdfs dfsadmin -report</code> cuánto tarda en figurar como muerto y qué pasa con la replicación; vuelve a arrancarlo con <code>docker start datanode3</code></li>
<li>Mide con <code>docker stats</code> el consumo de <code>namenode</code> con y sin Jupyter arrancado, y compáralo con su <code>mem_limit</code></li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="section-divider" data-theme="tcdm" data-lang="es" lang="es" class="section-divider" data-marpit-pagination="62" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:section-divider;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="m%C3%A1s-all%C3%A1-de-un-equipo">Más allá de un equipo</h1>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-theme="tcdm" data-lang="es" lang="es" data-marpit-pagination="63" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="del-laboratorio-a-un-cl%C3%BAster-real">Del laboratorio a un clúster real</h1>
<ul>
<li>Compose gestiona contenedores en <strong>un solo</strong> equipo: el clúster del curso simula cuatro nodos que en realidad comparten la misma máquina</li>
<li>En varios equipos, los contenedores los reparte un <strong>orquestador</strong>:
<ul>
<li><strong>Kubernetes</strong>: el estándar de facto; Spark, Trino o Flink tienen modos de despliegue propios sobre él</li>
<li><strong>Docker Swarm</strong>: modo de Docker que despliega un fichero Compose en varios nodos con <code>docker stack deploy</code></li>
</ul>
</li>
<li>En la nube, servicios gestionados como AWS EMR ofrecen Hadoop y Spark ya instalados</li>
<li>Las ideas se mantienen: imágenes inmutables, estado en volúmenes, servicios que se encuentran por nombre y configuración declarativa</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="bibliography" data-theme="tcdm" data-lang="es" lang="es" class="bibliography" data-marpit-pagination="64" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:bibliography;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
