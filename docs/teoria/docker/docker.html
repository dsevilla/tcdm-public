<h1 id="para-qu%C3%A9-sirven-estas-transparencias">Para qué sirven estas transparencias</h1>
<p>El clúster del curso son <strong>contenedores Docker</strong> que se arrancan y paran con <strong>Docker Compose</strong> y con el <strong><code>Makefile</code></strong> de <code>entorno/</code></p>
<ul>
<li>No hay que construir las imágenes: se descargan ya publicadas</li>
<li>Sí hay que <strong>entender</strong> cómo están hechas y qué guarda cada pieza</li>
<li>Y saber <strong>mirar el sistema</strong> en cualquier momento: qué está en marcha, dónde están los datos, qué se pierde con cada orden de parada</li>
</ul>
<blockquote>
<p>Todos los ejemplos usan los ficheros reales del curso: <code>make-images/Dockerfile*</code>, <code>entorno/compose-*.yml</code> y <code>entorno/Makefile</code></p>
</blockquote>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-theme="tcdm" data-lang="es" lang="es" data-marpit-pagination="3" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="d%C3%B3nde-se-ejecuta-cada-orden">Dónde se ejecuta cada orden</h1>
<p>En estas transparencias cada bloque indica dónde se teclea:</p>
<table>
<thead>
<tr>
<th>Comentario</th>
<th>Dónde</th>
<th>Ejemplo</th>
</tr>
</thead>
<tbody>
<tr>
<td><code># equipo</code></td>
<td>Terminal de tu equipo (en Windows, la de WSL2), en la raíz de la distribución: el directorio que contiene <code>s1/</code> y <code>entorno/</code></td>
<td><code>make -C entorno status</code></td>
</tr>
<tr>
<td><code># namenode</code></td>
<td>Dentro del contenedor, tras <code>docker exec -it namenode bash</code></td>
<td><code>su - luser</code></td>
</tr>
</tbody>
</table>
<ul>
<li><code>docker</code> y <code>make</code> sólo existen en tu equipo</li>
<li><code>hdfs</code>, <code>yarn</code> o <code>java</code> sólo existen dentro de los contenedores</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="compact" data-theme="tcdm" data-lang="es" lang="es" class="compact" data-marpit-pagination="4" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:compact;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="%C3%ADndice">Índice</h1>
<ul>
<li><strong>Contenedores e imágenes</strong>: qué es cada cosa, capas, nombres y registros</li>
<li><strong>Órdenes básicas</strong>: <code>pull</code>, <code>run</code>, <code>ps</code>, <code>exec</code>, <code>logs</code>, <code>cp</code>, <code>rm</code></li>
<li><strong>Dockerfile</strong>: cómo se construyen <code>hadoop-base</code>, <code>namenode-image</code> y <code>datanode-image</code></li>
<li><strong>Volúmenes</strong>: dónde vive el HDFS y qué sobrevive a cada orden</li>
<li><strong>Redes</strong>: <code>hadoop-cluster</code>, nombres de <em>host</em> y puertos publicados</li>
<li><strong>Docker Compose</strong>: <code>compose-hadoop-cluster.yml</code> línea a línea</li>
<li><strong>El <code>Makefile</code> del entorno</strong>: arrancar, parar y borrar</li>
<li><strong>Ver cómo está el sistema</strong>: diagnóstico paso a paso</li>
<li><strong>Actividades</strong></li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="section-divider" data-theme="tcdm" data-lang="es" lang="es" class="section-divider" data-marpit-pagination="5" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:section-divider;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="contenedores-e-im%C3%A1genes">Contenedores e imágenes</h1>
<p>Qué es cada pieza y cómo se relacionan</p>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-theme="tcdm" data-lang="es" lang="es" data-marpit-pagination="6" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="qu%C3%A9-es-un-contenedor">Qué es un contenedor</h1>
<ul>
<li>Un <strong>proceso</strong> (o grupo de procesos) del sistema anfitrión que el núcleo aísla del resto:
<ul>
<li><em>namespaces</em>: lista de procesos, red, sistema de ficheros, nombre de <em>host</em> y usuarios propios</li>
<li><em>cgroups</em>: límites de CPU y memoria (<code>cpus: 2.0</code>, <code>mem_limit: 4096m</code>)</li>
</ul>
</li>
<li><strong>No es una máquina virtual</strong>: no hay otro núcleo ni se arranca un sistema operativo; comparte el núcleo Linux del anfitrión</li>
<li>En Windows y macOS, Docker Desktop ejecuta una <strong>máquina virtual Linux ligera</strong> (WSL2 en Windows) y los contenedores viven dentro de ella</li>
</ul>
<blockquote>
<p>Por eso la memoria que asignas a Docker Desktop es el techo de <strong>todo</strong> el clúster: los cuatro contenedores comparten esa máquina virtual</p>
</blockquote>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="dense" data-theme="tcdm" data-lang="es" lang="es" class="dense" data-marpit-pagination="7" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:dense;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="las-cuatro-piezas-de-docker">Las cuatro piezas de Docker</h1>
<table>
<thead>
<tr>
<th>Pieza</th>
<th>Qué es</th>
<th>En el curso</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Imagen</strong></td>
<td>Sistema de ficheros de sólo lectura, por capas, más metadatos (variables, orden inicial, puertos)</td>
<td><code>dsevilla/namenode-image:26-27</code>, <code>dsevilla/datanode-image:26-27</code></td>
</tr>
<tr>
<td><strong>Contenedor</strong></td>
<td>Una imagen en ejecución, con una <strong>capa de escritura</strong> propia encima</td>
<td><code>namenode</code>, <code>datanode1</code>, <code>datanode2</code>, <code>datanode3</code></td>
</tr>
<tr>
<td><strong>Volumen</strong></td>
<td>Almacenamiento gestionado por Docker que <strong>no pertenece</strong> al contenedor y sobrevive a su borrado</td>
<td><code>tcdm-26-27-namenode-data</code>, <code>tcdm-26-27-datanodeN-data</code></td>
</tr>
<tr>
<td><strong>Red</strong></td>
<td>Red virtual con DNS propio entre contenedores</td>
<td><code>hadoop-cluster</code></td>
</tr>
</tbody>
</table>
<ul>
<li>De una misma imagen salen muchos contenedores: <code>datanode1</code>, <code>datanode2</code> y <code>datanode3</code> comparten <code>datanode-image</code></li>
<li>Borrar un contenedor no borra su imagen ni sus volúmenes</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="8" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="capas-y-copia-en-escritura">Capas y copia en escritura</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">  contenedor datanode1        contenedor datanode2
 ┌──────────────────────┐    ┌──────────────────────┐
 │ capa de escritura    │    │ capa de escritura    │  ← se pierde al borrar
 └──────────┬───────────┘    └──────────┬───────────┘    el contenedor
            └─────────────┬─────────────┘
 ┌────────────────────────┴───────────────────────────┐
 │ datanode-image: configuración DataNode/NodeManager │  ← sólo lectura,
 ├────────────────────────────────────────────────────┤    compartidas
 │ hadoop-base: usuarios, Hadoop 3.5.0, Java 17, ...  │
 ├────────────────────────────────────────────────────┤
 │ ubuntu:26.04                                       │
 └────────────────────────────────────────────────────┘
   volumen tcdm-26-27-datanode1-data → /var/data/hdfs/datanode (aparte)
</code></pre>
<ul>
<li>Al modificar un fichero de la imagen se copia primero a la capa de escritura</li>
<li>Las capas comunes se descargan y se guardan <strong>una sola vez</strong> en el disco</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="compact" data-theme="tcdm" data-lang="es" lang="es" class="compact" data-marpit-pagination="9" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:compact;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="nombres-de-imagen-y-registros">Nombres de imagen y registros</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">docker.io / dsevilla / namenode-image : 26-27
└registro┘  └usuario┘  └──repositorio─┘ └etiqueta┘
</code></pre>
<ul>
<li>Si no se indica, el registro es Docker Hub (<code>docker.io</code>)</li>
<li>Si no se indica, la etiqueta es <code>latest</code>: el curso <strong>no</strong> la usa para sus imágenes, porque <code>latest</code> cambia sin avisar; <code>26-27</code> identifica el curso</li>
<li>Una etiqueta puede apuntar a varias imágenes, <strong>una por arquitectura</strong>:</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># equipo</span>
docker manifest inspect dsevilla/namenode-image:26-27 | grep architecture
<span class="hljs-comment">#            &quot;architecture&quot;: &quot;amd64&quot;,</span>
<span class="hljs-comment">#            &quot;architecture&quot;: &quot;arm64&quot;,</span>
</code></pre>
<p>Docker descarga sola la variante de tu equipo (PC con Intel/AMD o Mac con Apple Silicon)</p>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="section-divider" data-theme="tcdm" data-lang="es" lang="es" class="section-divider" data-marpit-pagination="10" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:section-divider;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="%C3%B3rdenes-b%C3%A1sicas">Órdenes básicas</h1>
<p>Imágenes y contenedores desde la terminal</p>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="11" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="im%C3%A1genes-descargar-listar-inspeccionar-y-borrar">Imágenes: descargar, listar, inspeccionar y borrar</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># equipo</span>
docker pull dsevilla/datanode-image:26-27     <span class="hljs-comment"># descarga (Compose lo hace solo)</span>
docker image <span class="hljs-built_in">ls</span>                               <span class="hljs-comment"># imágenes locales y su tamaño</span>
docker image inspect dsevilla/datanode-image:26-27 \
    --format <span class="hljs-string">&#x27;{{.Config.Entrypoint}} {{.Config.Cmd}}&#x27;</span>
<span class="hljs-comment"># [/usr/bin/tini -g --] [/inicio.sh]</span>
docker image <span class="hljs-built_in">history</span> dsevilla/namenode-image:26-27   <span class="hljs-comment"># capas y su tamaño</span>
docker image <span class="hljs-built_in">rm</span> dsevilla/datanode-image:26-27        <span class="hljs-comment"># falla si un contenedor la usa</span>
</code></pre>
<ul>
<li><code>inspect</code> devuelve JSON; <code>--format</code> extrae un campo con plantillas de Go</li>
<li><code>history</code> muestra cada instrucción del Dockerfile y cuánto ocupa su capa: la del entorno Python del NameNode es la mayor</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="dense" data-theme="tcdm" data-lang="es" lang="es" class="dense" data-marpit-pagination="12" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:dense;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="docker-run-crear-y-arrancar-un-contenedor"><code>docker run</code>: crear y arrancar un contenedor</h1>
<p><code>docker run [opciones] imagen [orden]</code> — la orden, si se da, sustituye a la <code>CMD</code> de la imagen</p>
<table>
<thead>
<tr>
<th>Opción</th>
<th>Efecto</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>-d</code></td>
<td>Segundo plano (<em>detached</em>)</td>
</tr>
<tr>
<td><code>-i -t</code> (<code>-it</code>)</td>
<td>Entrada estándar abierta y terminal: para un <code>bash</code> interactivo</td>
</tr>
<tr>
<td><code>--rm</code></td>
<td>Borra el contenedor al terminar (si no, se acumulan contenedores parados)</td>
</tr>
<tr>
<td><code>--name nombre</code></td>
<td>Nombre fijo en lugar de uno aleatorio</td>
</tr>
<tr>
<td><code>-p 127.0.0.1:9870:9870</code></td>
<td>Publica un puerto del contenedor en el equipo, sólo en la interfaz local</td>
</tr>
<tr>
<td><code>-v volumen:/ruta</code></td>
<td>Monta un volumen con nombre (o un directorio del equipo)</td>
</tr>
<tr>
<td><code>-e VAR=valor</code></td>
<td>Variable de entorno</td>
</tr>
<tr>
<td><code>--network</code>, <code>--memory</code>, <code>--cpus</code></td>
<td>Red a la que se conecta; límites de memoria y CPU</td>
</tr>
</tbody>
</table>
<p>El clúster no se lanza con <code>docker run</code>: Compose reúne todas estas opciones en un fichero</p>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="13" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="mirar-una-imagen-sin-arrancar-el-cl%C3%BAster">Mirar una imagen sin arrancar el clúster</h1>
<p>Un contenedor de usar y tirar sirve para explorar la imagen:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># equipo</span>
docker run --<span class="hljs-built_in">rm</span> -it dsevilla/datanode-image:26-27 bash
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># dentro del contenedor temporal (sale con exit y se borra)</span>
<span class="hljs-built_in">cat</span> /inicio.sh                                  <span class="hljs-comment"># qué haría al arrancar</span>
<span class="hljs-built_in">ls</span> /opt/bd/hadoop/etc/hadoop/                   <span class="hljs-comment"># configuración de Hadoop</span>
grep -A1 resource.memory-mb /opt/bd/hadoop/etc/hadoop/yarn-site.xml
su - hdadmin -c jps                             <span class="hljs-comment"># no hay demonios: sólo Jps</span>
</code></pre>
<ul>
<li><code>bash</code> sustituye a <code>/inicio.sh</code>: no arranca ningún demonio</li>
<li>No se conecta a <code>hadoop-cluster</code> ni monta volúmenes: no toca tu clúster</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="dense" data-theme="tcdm" data-lang="es" lang="es" class="dense" data-marpit-pagination="14" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:dense;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="ciclo-de-vida-de-un-contenedor">Ciclo de vida de un contenedor</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text"> create ──► running ──stop──► exited ──start──► running
              │                  │
              └──kill (SIGKILL)──┘          rm ──► (eliminado)
</code></pre>
<table>
<thead>
<tr>
<th>Orden</th>
<th>Efecto</th>
<th>Capa de escritura</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>docker stop namenode</code></td>
<td>Envía <code>SIGTERM</code>; a los 10 s, <code>SIGKILL</code></td>
<td>Se conserva</td>
</tr>
<tr>
<td><code>docker start namenode</code></td>
<td>Vuelve a ejecutar la orden inicial en el <strong>mismo</strong> contenedor</td>
<td>Se conserva</td>
</tr>
<tr>
<td><code>docker restart namenode</code></td>
<td><code>stop</code> + <code>start</code></td>
<td>Se conserva</td>
</tr>
<tr>
<td><code>docker rm namenode</code></td>
<td>Elimina un contenedor parado</td>
<td><strong>Se pierde</strong></td>
</tr>
<tr>
<td><code>docker ps</code> / <code>docker ps -a</code></td>
<td>En marcha / también los parados</td>
<td>—</td>
</tr>
</tbody>
</table>
<p>Código de salida en <code>STATUS</code>: <code>Exited (0)</code> normal, <code>(143)</code> terminado con <code>SIGTERM</code>, <code>(137)</code> con <code>SIGKILL</code>, a menudo <strong>por falta de memoria</strong></p>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="15" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="ejecutar-%C3%B3rdenes-dentro-de-un-contenedor-docker-exec">Ejecutar órdenes dentro de un contenedor: <code>docker exec</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># equipo: una orden suelta, como en las celdas de S1</span>
docker <span class="hljs-built_in">exec</span> namenode su - luser -c <span class="hljs-string">&#x27;hdfs dfs -ls /&#x27;</span>

<span class="hljs-comment"># equipo: una terminal interactiva</span>
docker <span class="hljs-built_in">exec</span> -it namenode bash
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># namenode (eres root): cambia al usuario adecuado</span>
su - hdadmin      <span class="hljs-comment"># administra los demonios: hdfs dfsadmin -report, yarn node -list</span>
su - luser        <span class="hljs-comment"># trabaja con los datos: hdfs dfs -ls /datalake</span>
</code></pre>
<ul>
<li><code>docker exec</code> sólo funciona con el contenedor <strong>en marcha</strong></li>
<li><code>su -</code> abre una <em>shell</em> de <em>login</em>: carga <code>/etc/profile.d/hadoop.sh</code>, que añade <code>hdfs</code> y <code>yarn</code> al <code>PATH</code>. Con <code>docker exec -u luser namenode hdfs ...</code> ese <code>PATH</code> no se carga y la orden no se encuentra</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="16" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="copiar-ficheros-y-leer-la-salida-de-un-contenedor">Copiar ficheros y leer la salida de un contenedor</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># equipo: copiar entre el equipo y un contenedor (en ambos sentidos)</span>
docker <span class="hljs-built_in">cp</span> namenode:/opt/bd/hadoop/etc/hadoop/hdfs-site.xml .
docker <span class="hljs-built_in">cp</span> mis-datos.csv namenode:/tmp/

<span class="hljs-comment"># equipo: salida estándar del proceso inicial</span>
docker logs namenode
docker logs --<span class="hljs-built_in">tail</span> 50 -f datanode2        <span class="hljs-comment"># últimas 50 líneas y seguir</span>
</code></pre>
<ul>
<li><code>docker logs</code> sólo muestra lo que escribe el proceso inicial (<code>/inicio.sh</code>): si un demonio no arranca, el <em>script</em> termina con error y aquí se ve por qué</li>
<li>Los demonios de Hadoop escriben <strong>sus propios</strong> registros dentro del contenedor, en <code>/opt/bd/hadoop/logs/</code> (se verá en «Ver cómo está el sistema»)</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="section-divider" data-theme="tcdm" data-lang="es" lang="es" class="section-divider" data-marpit-pagination="17" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:section-divider;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="dockerfile">Dockerfile</h1>
<p>Cómo se construyen las imágenes del curso</p>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="dense" data-theme="tcdm" data-lang="es" lang="es" class="dense" data-marpit-pagination="18" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:dense;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="instrucciones-de-un-dockerfile">Instrucciones de un Dockerfile</h1>
<table>
<thead>
<tr>
<th>Instrucción</th>
<th>Qué hace</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>FROM imagen</code></td>
<td>Imagen de partida; cada <code>FROM</code> empieza una etapa</td>
</tr>
<tr>
<td><code>ARG NOMBRE=valor</code></td>
<td>Parámetro de construcción (<code>--build-arg</code>); no queda en el contenedor</td>
</tr>
<tr>
<td><code>ENV NOMBRE=valor</code></td>
<td>Variable de entorno que <strong>sí</strong> queda en la imagen y en sus contenedores</td>
</tr>
<tr>
<td><code>COPY origen destino</code></td>
<td>Copia ficheros del contexto de construcción a la imagen</td>
</tr>
<tr>
<td><code>ADD url destino</code></td>
<td>Como <code>COPY</code>, y además descarga URL (con <code>--checksum</code> para verificarlas)</td>
</tr>
<tr>
<td><code>RUN orden</code></td>
<td>Ejecuta una orden durante la construcción; el resultado es una capa nueva</td>
</tr>
<tr>
<td><code>USER</code>, <code>WORKDIR</code></td>
<td>Usuario y directorio para las instrucciones siguientes y el contenedor</td>
</tr>
<tr>
<td><code>EXPOSE puertos</code></td>
<td><strong>Documenta</strong> los puertos del servicio; no publica nada</td>
</tr>
<tr>
<td><code>ENTRYPOINT [...]</code></td>
<td>Programa que se ejecuta siempre al arrancar</td>
</tr>
<tr>
<td><code>CMD [...]</code></td>
<td>Argumentos por defecto del <code>ENTRYPOINT</code>; <code>docker run imagen orden</code> los sustituye</td>
</tr>
<tr>
<td><code>LABEL clave=valor</code></td>
<td>Metadatos (autor, versión...)</td>
</tr>
</tbody>
</table>
<p>Referencia: <a href="https://docs.docker.com/reference/dockerfile/" target="_blank" rel="noopener noreferrer">https://docs.docker.com/reference/dockerfile/</a></p>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="19" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="tres-im%C3%A1genes-relacionadas">Tres imágenes relacionadas</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">                    ubuntu:26.04
                         │  FROM
          dsevilla/hadoop-base:26-27   Java 17, Hadoop 3.5.0, herramientas,
                         │             usuarios hdadmin y luser
            ┌────────────┴─────────────┐  FROM ${BASE_IMAGE}
 dsevilla/namenode-image:26-27   dsevilla/datanode-image:26-27
 NameNode, ResourceManager,      DataNode y NodeManager,
 Timeline Server, HDFS           2 vcores y 2560 MB para YARN
 formateado, entorno Python
</code></pre>
<ul>
<li>Hadoop se descarga e instala <strong>una vez</strong>, en la base</li>
<li>Cada imagen de servicio añade sólo lo propio de su tipo de nodo</li>
<li><code>make-images/</code> no se distribuye con las sesiones: S1 («Cómo se construyen las imágenes del curso») y estas transparencias citan sus ficheros, y el resultado se puede inspeccionar en las propias imágenes</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="20" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="la-imagen-base-make-imagesdockerfile">La imagen base: <code>make-images/Dockerfile</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dockerfile"><span class="hljs-keyword">FROM</span> ubuntu:<span class="hljs-number">26.04</span>

<span class="hljs-keyword">ARG</span> HADOOP_VERSION=<span class="hljs-number">3.5</span>.<span class="hljs-number">0</span>
<span class="hljs-keyword">ENV</span> HADOOP_VERSION=${HADOOP_VERSION} \
    JAVA_HOME=/usr/lib/jvm/java-<span class="hljs-number">17</span>-openjdk \
    HADOOP_HOME=/opt/bd/hadoop \
    HADOOP_CONF_DIR=/opt/bd/hadoop/etc/hadoop

<span class="hljs-keyword">COPY</span><span class="language-bash"> install-base-packages.sh /root/install-base-packages.sh</span>
<span class="hljs-keyword">RUN</span><span class="language-bash"> /bin/sh -x /root/install-base-packages.sh &amp;&amp; \
    <span class="hljs-built_in">rm</span> -f /root/install-base-packages.sh</span>
<span class="hljs-comment"># ... igual con install-hadoop.sh y configure-hadoop-users.sh</span>

<span class="hljs-keyword">ENTRYPOINT</span><span class="language-bash"> [<span class="hljs-string">&quot;/usr/bin/tini&quot;</span>, <span class="hljs-string">&quot;-g&quot;</span>, <span class="hljs-string">&quot;--&quot;</span>]</span>
<span class="hljs-keyword">CMD</span><span class="language-bash"> [<span class="hljs-string">&quot;/bin/bash&quot;</span>]</span>
</code></pre>
<ul>
<li><code>ARG</code> elige la versión al construir; <code>ENV</code> deja las rutas para siempre</li>
<li>Cada paso es un <em>script</em> que se copia, se ejecuta y se borra</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-theme="tcdm" data-lang="es" lang="es" data-marpit-pagination="21" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="un-run-por-paso-con-su-limpieza-dentro">Un <code>RUN</code> por paso, con su limpieza dentro</h1>
<p><code>install-base-packages.sh</code> instala y limpia en <strong>la misma</strong> orden <code>RUN</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sh">apt-get update -qq
apt-get install -qq -y --no-install-recommends ca-certificates curl tini \
    openjdk-17-jdk-headless python3 python3-venv ...
apt-get clean
<span class="hljs-built_in">rm</span> -rf /var/lib/apt/lists/* /var/cache/apt/archives/* /tmp/* /var/tmp/*
</code></pre>
<ul>
<li>Cada <code>RUN</code> produce una capa, y una capa <strong>no puede encoger</strong> a las anteriores: borrar en un <code>RUN</code> posterior sólo oculta los ficheros</li>
<li>Por eso la caché de <code>apt</code> se borra antes de que termine el mismo <code>RUN</code></li>
<li><code>install-hadoop.sh</code> sigue el mismo criterio: descarga el <code>.tar.gz</code>, comprueba su SHA-512, lo descomprime y lo borra</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="22" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="las-im%C3%A1genes-de-servicio-dockerfilenamenode">Las imágenes de servicio: <code>Dockerfile.namenode</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dockerfile"><span class="hljs-keyword">ARG</span> BASE_IMAGE=dsevilla/hadoop-base:<span class="hljs-number">26</span>-<span class="hljs-number">27</span>
<span class="hljs-keyword">FROM</span> ${BASE_IMAGE}

<span class="hljs-keyword">COPY</span><span class="language-bash"> namenode.sh /tmp/</span>
<span class="hljs-keyword">COPY</span><span class="language-bash"> namenode-hadoop-xml/ /tmp/namenode-hadoop-xml/</span>
<span class="hljs-keyword">RUN</span><span class="language-bash"> sh /tmp/namenode.sh &amp;&amp; \
    <span class="hljs-built_in">rm</span> -f /tmp/namenode.sh /tmp/namenode-hadoop-xml/*.xml &amp;&amp; \
    <span class="hljs-built_in">rmdir</span> /tmp/namenode-hadoop-xml</span>

<span class="hljs-keyword">COPY</span><span class="language-bash"> requirements-namenode.txt install-python-environment.sh /tmp/</span>
<span class="hljs-keyword">RUN</span><span class="language-bash"> sh /tmp/install-python-environment.sh &amp;&amp; \
    <span class="hljs-built_in">rm</span> -f /tmp/install-python-environment.sh /tmp/requirements-namenode.txt</span>

<span class="hljs-keyword">EXPOSE</span> <span class="hljs-number">9870</span> <span class="hljs-number">9871</span> <span class="hljs-number">8088</span> <span class="hljs-number">8000</span>-<span class="hljs-number">10000</span>
<span class="hljs-keyword">CMD</span><span class="language-bash"> [<span class="hljs-string">&quot;/inicio.sh&quot;</span>]</span>
</code></pre>
<ul>
<li><code>ARG</code> antes de <code>FROM</code> permite cambiar la imagen de partida al construir</li>
<li>No repite <code>ENTRYPOINT</code>: hereda el <code>tini</code> de la base y sólo cambia <code>CMD</code></li>
<li><code>Dockerfile.datanode</code> es igual, con <code>datanode.sh</code>, <code>datanode-hadoop-xml/</code> y sin entorno Python</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-theme="tcdm" data-lang="es" lang="es" data-marpit-pagination="23" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="qu%C3%A9-hace-namenodesh-durante-la-construcci%C3%B3n">Qué hace <code>namenode.sh</code> durante la construcción</h1>
<ol>
<li>Copia <code>core-site.xml</code>, <code>hdfs-site.xml</code>, <code>mapred-site.xml</code> y <code>yarn-site.xml</code> desde <code>namenode-hadoop-xml/</code> (que el Dockerfile ha dejado en <code>/tmp</code>) a <code>$HADOOP_CONF_DIR</code> con <code>install -m 0644 -o hdadmin -g hadoop</code>, para fijar modo y propietario</li>
<li><strong>Formatea</strong> HDFS: <code>hdfs namenode -format</code> en <code>/var/data/hdfs/namenode</code></li>
<li>Arranca un NameNode temporal y crea <code>/user/luser</code>, <code>/tmp</code>, <code>/datalake/{raw,silver,gold}</code> y <code>/warehouse</code> con sus permisos</li>
<li>Para el NameNode y genera <code>/inicio.sh</code></li>
</ol>
<blockquote>
<p>La imagen ya contiene un HDFS recién formateado y con sus directorios</p>
</blockquote>
<ul>
<li>Para arrancar ese NameNode, <code>fs.defaultFS</code> (<code>hdfs://namenode:9000/</code>) debe resolverse: <code>createimages.sh</code> construye con <code>--add-host namenode:127.0.0.1</code></li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="24" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="qu%C3%A9-ocurre-al-arrancar-entrypoint--cmd">Qué ocurre al arrancar: <code>ENTRYPOINT</code> + <code>CMD</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">PID 1: /usr/bin/tini -g -- /inicio.sh
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sh"><span class="hljs-meta">#!/usr/bin/env sh            # /inicio.sh del NameNode (resumido)</span>
<span class="hljs-built_in">set</span> -eu
su - hdadmin -c <span class="hljs-string">&quot;... hdfs --daemon start namenode&quot;</span>
su - hdadmin -c <span class="hljs-string">&quot;... yarn --daemon start resourcemanager&quot;</span>
su - hdadmin -c <span class="hljs-string">&quot;... yarn --daemon start timelineserver&quot;</span>
<span class="hljs-built_in">exec</span> <span class="hljs-built_in">tail</span> -f /dev/null       <span class="hljs-comment"># mantiene vivo el contenedor</span>
</code></pre>
<ul>
<li><code>tini</code> reenvía señales y recoge los procesos que quedan huérfanos</li>
<li>Los demonios se lanzan en segundo plano; el contenedor vive mientras viva <code>tail</code></li>
<li><strong>Consecuencia</strong>: <code>running</code> sólo significa que <code>tail</code> sigue vivo. Si el NameNode cae después, el contenedor sigue <code>running</code>; hay que comprobar Hadoop (<code>jps</code>, <code>dfsadmin -report</code>)</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="25" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="construir-docker-build">Construir: <code>docker build</code></h1>
<p><code>make-images/createimages.sh</code> (construcción local, sin publicar):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">docker build \
    --build-arg <span class="hljs-string">&quot;BASE_IMAGE=<span class="hljs-variable">${BASE_IMAGE}</span>&quot;</span> \
    --add-host namenode:127.0.0.1 \
    -f Dockerfile.namenode \
    -t <span class="hljs-string">&quot;dsevilla/namenode-image:<span class="hljs-variable">${IMAGE_YEAR}</span>&quot;</span> \
    .
</code></pre>
<ul>
<li><code>.</code> es el <strong>contexto</strong>: el directorio cuyos ficheros puede usar <code>COPY</code></li>
<li><code>-f</code> elige el Dockerfile; <code>-t</code> da nombre y etiqueta a la imagen</li>
<li>El CI usa <code>docker buildx build --platform linux/&lt;arquitectura&gt; --push</code> (<code>buildx-createimages.sh</code>): cada arquitectura se construye en un runner de esa arquitectura y se publica como <code>&lt;etiqueta&gt;-amd64</code> o <code>&lt;etiqueta&gt;-arm64</code>; <code>merge-manifests.sh</code> las une bajo la misma etiqueta. <code>install-hadoop.sh</code> elige el <code>.tar.gz</code> de Hadoop según la arquitectura</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-theme="tcdm" data-lang="es" lang="es" data-marpit-pagination="26" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="la-cach%C3%A9-de-construcci%C3%B3n">La caché de construcción</h1>
<p>Docker reutiliza una capa si la instrucción y los ficheros que copia no han cambiado, <strong>y</strong> todas las capas anteriores tampoco</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">FROM ${BASE_IMAGE}                          ✔ caché
COPY namenode.sh, namenode-hadoop-xml/      ✔ caché (mismos ficheros)
RUN sh /tmp/namenode.sh ...                 ✔ caché
COPY requirements-namenode.txt ... /tmp/    ✘ cambió requirements-namenode.txt
RUN sh /tmp/install-python-environment.sh   ✘ se repite
EXPOSE / CMD                                ✘ se repiten (instantáneas)
</code></pre>
<ul>
<li>Lo que cambia a menudo va <strong>al final</strong> del Dockerfile</li>
<li>Cambiar una línea de <code>requirements-namenode.txt</code> no vuelve a formatear HDFS</li>
<li>Cambiar la base obliga a reconstruir las dos imágenes de servicio</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="27" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="construcci%C3%B3n-en-varias-etapas-desde-s6">Construcción en varias etapas (desde S6)</h1>
<p><code>entorno/hive-metastore/Dockerfile</code>, que llega con la sesión 6:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-dockerfile"><span class="hljs-keyword">ARG</span> HIVE_IMAGE=apache/hive:<span class="hljs-number">4.2</span>.<span class="hljs-number">1</span>

<span class="hljs-keyword">FROM</span> scratch AS postgresql-jdbc
<span class="hljs-keyword">ARG</span> POSTGRES_JDBC_VERSION=<span class="hljs-number">42.7</span>.<span class="hljs-number">13</span>
<span class="hljs-keyword">ADD</span><span class="language-bash"> --checksum=sha256:6e0e4cc2...93 \
    https://repo1.maven.org/maven2/org/postgresql/postgresql/.../postgresql-<span class="hljs-variable">${POSTGRES_JDBC_VERSION}</span>.jar \
    /postgresql.jar</span>

<span class="hljs-keyword">FROM</span> ${HIVE_IMAGE}
<span class="hljs-keyword">USER</span> root
<span class="hljs-keyword">COPY</span><span class="language-bash"> --from=postgresql-jdbc --<span class="hljs-built_in">chown</span>=hive:hive /postgresql.jar /opt/hive/lib/postgres.jar</span>
<span class="hljs-keyword">COPY</span><span class="language-bash"> --<span class="hljs-built_in">chmod</span>=755 entrypoint-tcdm.sh /entrypoint-tcdm.sh</span>
<span class="hljs-keyword">USER</span> hive
<span class="hljs-keyword">ENTRYPOINT</span><span class="language-bash"> [<span class="hljs-string">&quot;/entrypoint-tcdm.sh&quot;</span>]</span>
</code></pre>
<ul>
<li>La primera etapa (<code>FROM scratch</code>, vacía) sólo descarga y verifica el <code>.jar</code></li>
<li>La imagen final copia de ella <strong>únicamente</strong> ese fichero (<code>COPY --from</code>)</li>
<li>Compose pasa otra <code>HIVE_IMAGE</code> con <code>build.args</code> (se verá más adelante)</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="section-divider" data-theme="tcdm" data-lang="es" lang="es" class="section-divider" data-marpit-pagination="28" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:section-divider;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="vol%C3%BAmenes">Volúmenes</h1>
<p>Dónde viven los datos y qué sobrevive a cada orden</p>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="dense" data-theme="tcdm" data-lang="es" lang="es" class="dense" data-marpit-pagination="29" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:dense;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="tres-sitios-donde-puede-escribir-un-contenedor">Tres sitios donde puede escribir un contenedor</h1>
<table>
<thead>
<tr>
<th>Sitio</th>
<th>Ejemplo en el curso</th>
<th>Sobrevive a <code>docker compose down</code></th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Capa de escritura</strong> del contenedor</td>
<td><code>/tmp</code>, <code>/opt/bd/hadoop/logs</code>, almacén del Timeline Server en <code>namenode</code></td>
<td><strong>No</strong></td>
</tr>
<tr>
<td><strong>Volumen con nombre</strong></td>
<td><code>tcdm-26-27-namenode-data</code> en <code>/var/data/hdfs/namenode</code></td>
<td>Sí</td>
</tr>
<tr>
<td><strong>Directorio del equipo</strong> (<em>bind mount</em>)</td>
<td><code>./trino-hdfs/etc</code> en <code>/etc/trino</code> (S6)</td>
<td>Sí: es un directorio de tu equipo</td>
</tr>
</tbody>
</table>
<ul>
<li>Volumen: Docker decide dónde guardarlo; se gestiona con <code>docker volume</code></li>
<li><em>Bind mount</em>: lo que cambias en el equipo se ve al instante dentro (y al revés, salvo con <code>:ro</code>, de sólo lectura)</li>
<li>El curso guarda <strong>todo el estado de HDFS en volúmenes</strong>: metadatos del NameNode y bloques de cada DataNode</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="30" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="los-vol%C3%BAmenes-del-cl%C3%BAster-hadoop">Los volúmenes del clúster Hadoop</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">services:</span>
  <span class="hljs-attr">namenode:</span>
    <span class="hljs-attr">volumes:</span>
      <span class="hljs-bullet">-</span> <span class="hljs-string">namenode-data:/var/data/hdfs/namenode</span>      <span class="hljs-comment"># dfs.namenode.name.dir</span>
  <span class="hljs-attr">datanode1:</span>
    <span class="hljs-attr">volumes:</span>
      <span class="hljs-bullet">-</span> <span class="hljs-string">datanode1-data:/var/data/hdfs/datanode</span>     <span class="hljs-comment"># dfs.datanode.data.dir</span>
  <span class="hljs-comment"># datanode2 y datanode3: cada uno con su propio volumen</span>
<span class="hljs-attr">volumes:</span>
  <span class="hljs-attr">namenode-data:</span>
    <span class="hljs-attr">name:</span> <span class="hljs-string">tcdm-26-27-namenode-data</span>
  <span class="hljs-attr">datanode1-data:</span>
    <span class="hljs-attr">name:</span> <span class="hljs-string">tcdm-26-27-datanode1-data</span>
  <span class="hljs-comment"># ...</span>
</code></pre>
<ul>
<li>A la izquierda de <code>:</code> el nombre corto del Compose; <code>name:</code> fija el nombre real en Docker, sin el prefijo del proyecto que Compose añadiría</li>
<li>Cada DataNode tiene <strong>su</strong> volumen: no comparten bloques</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-theme="tcdm" data-lang="es" lang="es" data-marpit-pagination="31" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="el-volumen-se-rellena-con-el-contenido-de-la-imagen">El volumen se rellena con el contenido de la imagen</h1>
<p>Al montar por primera vez un volumen <strong>vacío</strong> donde la imagen ya tiene ficheros, Docker copia esos ficheros al volumen</p>
<ol>
<li>Primer <code>up</code>: <code>tcdm-26-27-namenode-data</code> no existe → se crea y recibe el HDFS formateado que dejó <code>namenode.sh</code> en la imagen</li>
<li>Siguientes <code>up</code>: el volumen ya tiene datos → se monta tal cual, con todo lo que hayas guardado en HDFS</li>
<li>Tras borrar los volúmenes (<code>clean-hdfs</code>): el próximo <code>up</code> vuelve al punto 1, un HDFS vacío como el del primer día</li>
</ol>
<blockquote>
<p>Una imagen nueva <strong>no</strong> cambia un volumen con datos: conserva tu HDFS. Los cuatro volúmenes forman un todo: no se borran por separado</p>
</blockquote>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="32" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="inspeccionar-los-vol%C3%BAmenes">Inspeccionar los volúmenes</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># equipo</span>
docker volume <span class="hljs-built_in">ls</span> --filter name=tcdm-26-27
docker volume inspect tcdm-26-27-namenode-data
docker system <span class="hljs-built_in">df</span> -v | grep tcdm-26-27      <span class="hljs-comment"># espacio que ocupa cada volumen</span>
</code></pre>
<p>El <code>Mountpoint</code> que muestra <code>inspect</code> (<code>/var/lib/docker/volumes/...</code>) está dentro de la máquina virtual de Docker Desktop: para mirar dentro, se monta el volumen en un contenedor temporal, <strong>de sólo lectura</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># equipo</span>
docker run --<span class="hljs-built_in">rm</span> -v tcdm-26-27-namenode-data:/nn:ro \
    dsevilla/namenode-image:26-27 <span class="hljs-built_in">ls</span> -l /nn/current
docker run --<span class="hljs-built_in">rm</span> -v tcdm-26-27-datanode1-data:/dn:ro \
    dsevilla/namenode-image:26-27 sh -c <span class="hljs-string">&quot;find /dn -name &#x27;blk_*&#x27; | head&quot;</span>
</code></pre>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-theme="tcdm" data-lang="es" lang="es" data-marpit-pagination="33" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="qu%C3%A9-hay-dentro-de-los-vol%C3%BAmenes-hdfs">Qué hay dentro de los volúmenes HDFS</h1>
<ul>
<li><strong>NameNode</strong> (<code>/var/data/hdfs/namenode/current</code>):
<ul>
<li><code>fsimage_*</code>: imagen del espacio de nombres (directorios, ficheros, bloques de cada fichero)</li>
<li><code>edits_*</code>: cambios posteriores a la última imagen</li>
<li><code>VERSION</code>: incluye el <code>clusterID</code> del formateo</li>
</ul>
</li>
<li><strong>DataNode</strong> (<code>/var/data/hdfs/datanode/current/BP-*/current/finalized/</code>):
<ul>
<li><code>blk_&lt;id&gt;</code> y <code>blk_&lt;id&gt;_&lt;gen&gt;.meta</code>: cada bloque es un fichero normal (hasta 64 MB, <code>dfs.blocksize</code>) con sus sumas de control</li>
<li><code>VERSION</code> con el <strong>mismo</strong> <code>clusterID</code>: un DataNode con otro <code>clusterID</code> se niega a unirse (<code>Incompatible clusterIDs</code> en su registro)</li>
</ul>
</li>
</ul>
<blockquote>
<p>Un mismo bloque aparece en tres volúmenes de DataNode: es la replicación 3</p>
</blockquote>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="34" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="copia-de-seguridad-de-hdfs">Copia de seguridad de HDFS</h1>
<p>El contenido del clúster lo construyes tú sesión a sesión. Se puede guardar con el clúster <strong>parado</strong> (<code>make -C entorno stop</code>) y los cuatro volúmenes a la vez:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># equipo: un .tgz por volumen en el directorio actual</span>
<span class="hljs-keyword">for</span> v <span class="hljs-keyword">in</span> namenode datanode1 datanode2 datanode3; <span class="hljs-keyword">do</span>
  docker run --<span class="hljs-built_in">rm</span> -v <span class="hljs-string">&quot;tcdm-26-27-<span class="hljs-variable">$v</span>-data:/datos:ro&quot;</span> -v <span class="hljs-string">&quot;<span class="hljs-variable">$PWD</span>:/copia&quot;</span> \
    dsevilla/namenode-image:26-27 tar -czf <span class="hljs-string">&quot;/copia/<span class="hljs-variable">$v</span>.tgz&quot;</span> -C /datos .
<span class="hljs-keyword">done</span>
</code></pre>
<p>Para restaurarla, con los volúmenes borrados y <strong>antes</strong> de <code>hadoop-up</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># equipo</span>
<span class="hljs-keyword">for</span> v <span class="hljs-keyword">in</span> namenode datanode1 datanode2 datanode3; <span class="hljs-keyword">do</span>
  docker run --<span class="hljs-built_in">rm</span> -v <span class="hljs-string">&quot;tcdm-26-27-<span class="hljs-variable">$v</span>-data:/datos&quot;</span> -v <span class="hljs-string">&quot;<span class="hljs-variable">$PWD</span>:/copia:ro&quot;</span> \
    dsevilla/namenode-image:26-27 tar -xzf <span class="hljs-string">&quot;/copia/<span class="hljs-variable">$v</span>.tgz&quot;</span> -C /datos
<span class="hljs-keyword">done</span>
</code></pre>
<p>Compose avisará de que esos volúmenes no los creó él: es un aviso, no un error</p>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="dense" data-theme="tcdm" data-lang="es" lang="es" class="dense" data-marpit-pagination="35" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:dense;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="cuidado-con-las-%C3%B3rdenes-de-limpieza-globales">Cuidado con las órdenes de limpieza globales</h1>
<p>Las órdenes de limpieza de Docker no saben qué volúmenes son tuyos del curso:</p>
<table>
<thead>
<tr>
<th>Orden</th>
<th>Qué borra</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>docker container prune</code></td>
<td>Todos los contenedores <strong>parados</strong>: tras <code>make -C entorno stop</code>, también los del clúster (los volúmenes quedan)</td>
</tr>
<tr>
<td><code>docker image prune -a</code></td>
<td>Imágenes sin contenedor: obliga a descargar de nuevo</td>
</tr>
<tr>
<td><code>docker volume prune -a</code></td>
<td><strong>Todos</strong> los volúmenes sin contenedor: tras un <code>down</code>, <strong>el HDFS entero</strong></td>
</tr>
<tr>
<td><code>docker system prune</code></td>
<td>Contenedores parados, redes sin uso, caché de construcción</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Para el laboratorio usa las órdenes del <code>Makefile</code>, que dicen en cada caso qué se conserva</p>
</blockquote>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="section-divider" data-theme="tcdm" data-lang="es" lang="es" class="section-divider" data-marpit-pagination="36" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:section-divider;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="redes">Redes</h1>
<p>Cómo se encuentran los contenedores</p>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-theme="tcdm" data-lang="es" lang="es" data-marpit-pagination="37" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="la-red-hadoop-cluster">La red <code>hadoop-cluster</code></h1>
<ul>
<li>Red de tipo <em>bridge</em> con <strong>DNS interno</strong>: cada contenedor resuelve a los demás por su nombre de servicio, de contenedor o de alias</li>
<li>Se declara <strong>externa</strong>: la crea el <code>Makefile</code>, no el Compose</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">networks:</span>
  <span class="hljs-attr">hadoop-cluster:</span>
    <span class="hljs-attr">external:</span> <span class="hljs-literal">true</span>
    <span class="hljs-attr">name:</span> <span class="hljs-string">hadoop-cluster</span>
</code></pre>
<ul>
<li>Así varios proyectos Compose se ven entre sí: el clúster Hadoop, RustFS (S3) y, más adelante, Hive Metastore y Trino (S6) se unen a la misma red sin estar en el mismo fichero</li>
<li><code>namenode</code> tiene además dos alias, <code>resourcemanager</code> y <code>timelineserver</code>, que son los nombres que usa <code>yarn-site.xml</code></li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="38" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="ver-la-red-y-resolver-nombres">Ver la red y resolver nombres</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># equipo: qué contenedores hay en la red y con qué dirección IP</span>
docker network inspect hadoop-cluster \
  --format <span class="hljs-string">&#x27;{{range .Containers}}{{.Name}} {{.IPv4Address}}{{&quot;\n&quot;}}{{end}}&#x27;</span>

<span class="hljs-comment"># equipo: resolver nombres desde un DataNode</span>
docker <span class="hljs-built_in">exec</span> datanode1 getent hosts namenode
docker <span class="hljs-built_in">exec</span> datanode1 getent hosts resourcemanager   <span class="hljs-comment"># la misma IP</span>
docker <span class="hljs-built_in">exec</span> datanode1 ping -c 2 datanode3
</code></pre>
<ul>
<li>Las direcciones IP cambian al recrear los contenedores; los nombres no. Por eso la configuración de Hadoop sólo usa nombres</li>
<li><code>127.0.0.1</code> dentro de un contenedor es <strong>ese</strong> contenedor, no tu equipo</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-theme="tcdm" data-lang="es" lang="es" data-marpit-pagination="39" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="puertos-internos-y-puertos-publicados">Puertos internos y puertos publicados</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml">  <span class="hljs-attr">namenode:</span>
    <span class="hljs-attr">ports:</span>
      <span class="hljs-bullet">-</span> <span class="hljs-string">&quot;127.0.0.1:9870:9870&quot;</span> <span class="hljs-comment"># HDFS NameNode</span>
      <span class="hljs-bullet">-</span> <span class="hljs-string">&quot;127.0.0.1:8088:8088&quot;</span> <span class="hljs-comment"># YARN ResourceManager</span>
      <span class="hljs-bullet">-</span> <span class="hljs-string">&quot;127.0.0.1:8188:8188&quot;</span> <span class="hljs-comment"># YARN Timeline Server</span>
      <span class="hljs-bullet">-</span> <span class="hljs-string">&quot;127.0.0.1:8888:8888&quot;</span> <span class="hljs-comment"># Jupyter Lab de luser, arrancado a mano desde S2</span>
      <span class="hljs-bullet">-</span> <span class="hljs-string">&quot;127.0.0.1:4040:4040&quot;</span> <span class="hljs-comment"># Spark UI mientras haya una aplicación activa</span>
</code></pre>
<ul>
<li><code>IP:equipo:contenedor</code>: sólo tu equipo (<code>127.0.0.1</code>) llega a esos puertos; otros ordenadores de la red no</li>
<li>Dentro de <code>hadoop-cluster</code> <strong>todos</strong> los puertos están accesibles sin publicarlos: <code>namenode:9000</code> (RPC de HDFS) o <code>datanode1:9866</code> (bloques)</li>
<li>El <code>9000</code> del NameNode no se publica, y por eso no choca con el <code>9000</code> que publica RustFS en S3: en la red son <code>namenode:9000</code> y <code>rustfs:9000</code></li>
<li><code>EXPOSE</code> del Dockerfile no publica nada; lo hace <code>ports:</code></li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="section-divider" data-theme="tcdm" data-lang="es" lang="es" class="section-divider" data-marpit-pagination="40" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:section-divider;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="docker-compose">Docker Compose</h1>
<p>Un fichero describe todo el clúster</p>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-theme="tcdm" data-lang="es" lang="es" data-marpit-pagination="41" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="qu%C3%A9-es-docker-compose">Qué es Docker Compose</h1>
<ul>
<li>Describe en <strong>YAML</strong> servicios, volúmenes y redes, y los gestiona como un <strong>proyecto</strong>; se invoca como <code>docker compose</code> (Compose v2)</li>
<li>Un fichero por grupo de servicios en <code>entorno/</code>:</li>
</ul>
<table>
<thead>
<tr>
<th>Fichero</th>
<th>Proyecto (<code>name:</code>)</th>
<th>Desde</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>compose-hadoop-cluster.yml</code></td>
<td><code>tcdm-26-27-hadoop</code></td>
<td>S1</td>
</tr>
<tr>
<td><code>compose-s3.yml</code></td>
<td><code>tcdm-26-27-s3</code></td>
<td>S3</td>
</tr>
<tr>
<td><code>compose-warehouse-hdfs.yml</code></td>
<td><code>tcdm-26-27-warehouse-hdfs</code></td>
<td>S6</td>
</tr>
</tbody>
</table>
<blockquote>
<p>En Internet verás <code>docker-compose</code> (con guion) y <code>version: '2'</code>: son de Compose v1. Compose v2 ignora <code>version:</code> y avisa de que sobra</p>
</blockquote>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="42" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="compose-hadoop-clusteryml-el-namenode"><code>compose-hadoop-cluster.yml</code>: el NameNode</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">name:</span> <span class="hljs-string">tcdm-26-27-hadoop</span>

<span class="hljs-attr">services:</span>
  <span class="hljs-attr">namenode:</span>
    <span class="hljs-attr">image:</span> <span class="hljs-string">${NAMENODE_IMAGE:-dsevilla/namenode-image:26-27}</span>
    <span class="hljs-attr">container_name:</span> <span class="hljs-string">namenode</span>
    <span class="hljs-attr">hostname:</span> <span class="hljs-string">namenode</span>
    <span class="hljs-attr">ports:</span>
      <span class="hljs-bullet">-</span> <span class="hljs-string">&quot;127.0.0.1:9870:9870&quot;</span> <span class="hljs-comment"># HDFS NameNode</span>
      <span class="hljs-comment"># ... 8088, 8188, 8888, 4040</span>
    <span class="hljs-attr">cpus:</span> <span class="hljs-number">2.0</span>
    <span class="hljs-attr">mem_limit:</span> <span class="hljs-string">4096m</span>
    <span class="hljs-attr">volumes:</span>
      <span class="hljs-bullet">-</span> <span class="hljs-string">namenode-data:/var/data/hdfs/namenode</span>
    <span class="hljs-attr">networks:</span>
      <span class="hljs-attr">hadoop-cluster:</span>
        <span class="hljs-attr">aliases:</span>
          <span class="hljs-bullet">-</span> <span class="hljs-string">resourcemanager</span>
          <span class="hljs-bullet">-</span> <span class="hljs-string">timelineserver</span>
</code></pre>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-theme="tcdm" data-lang="es" lang="es" data-marpit-pagination="43" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="las-claves-de-un-servicio">Las claves de un servicio</h1>
<ul>
<li><code>image</code>: imagen de partida. <code>${VAR:-valor}</code> usa la variable de entorno <code>NAMENODE_IMAGE</code> si existe y, si no, el valor por defecto</li>
<li><code>container_name</code>: nombre fijo del contenedor. Sin él sería <code>tcdm-26-27-hadoop-namenode-1</code>; con él, <code>docker exec namenode</code> funciona</li>
<li><code>hostname</code>: nombre del <em>host</em> dentro del contenedor (lo que ve Hadoop)</li>
<li><code>cpus</code>, <code>mem_limit</code>: límites del contenedor, <strong>no</strong> reservas. El NameNode aloja NameNode, ResourceManager, Timeline Server y, desde S2, Jupyter y el <em>driver</em> de Spark</li>
<li>Cada DataNode: <code>cpus: 2.0</code> y <code>mem_limit: 3072m</code>, de los que YARN anuncia 2560 MB (<code>yarn-site.xml</code> de la imagen) y deja 512 MB para el DataNode, el NodeManager y el resto de procesos</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="44" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="ver-el-compose-tal-y-como-lo-entiende-docker">Ver el Compose tal y como lo entiende Docker</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># equipo: fichero final, con variables sustituidas y valores normalizados</span>
docker compose -f entorno/compose-hadoop-cluster.yml config

<span class="hljs-comment"># equipo: probar una variable sin arrancar nada</span>
NAMENODE_IMAGE=prueba/otra:1 \
  docker compose -f entorno/compose-hadoop-cluster.yml config | grep image
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">    image: dsevilla/datanode-image:26-27
    image: dsevilla/datanode-image:26-27
    image: dsevilla/datanode-image:26-27
    image: prueba/otra:1
</code></pre>
<ul>
<li><code>config</code> valida el fichero y no crea ni arranca nada</li>
<li>Compose lee también un fichero <code>.env</code> del directorio del Compose (<code>entorno/.env.example</code> muestra las variables que se pueden cambiar)</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="dense" data-theme="tcdm" data-lang="es" lang="es" class="dense" data-marpit-pagination="45" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:dense;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="%C3%B3rdenes-de-compose">Órdenes de Compose</h1>
<p>Todas con <code>docker compose -f entorno/compose-hadoop-cluster.yml ...</code></p>
<table>
<thead>
<tr>
<th>Orden</th>
<th>Efecto</th>
<th>Contenedores</th>
<th>Volúmenes</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>up -d</code></td>
<td>Descarga lo que falte, crea y arranca</td>
<td>Crea o reutiliza</td>
<td>Crea si no existen</td>
</tr>
<tr>
<td><code>ps -a</code></td>
<td>Estado de los servicios del proyecto</td>
<td>—</td>
<td>—</td>
</tr>
<tr>
<td><code>logs -f [servicio]</code></td>
<td>Salida de todos o de uno</td>
<td>—</td>
<td>—</td>
</tr>
<tr>
<td><code>top</code></td>
<td>Procesos de cada contenedor</td>
<td>—</td>
<td>—</td>
</tr>
<tr>
<td><code>exec servicio orden</code></td>
<td>Como <code>docker exec</code>, por nombre de servicio</td>
<td>—</td>
<td>—</td>
</tr>
<tr>
<td><code>stop</code> / <code>start</code></td>
<td>Para / reanuda los mismos contenedores</td>
<td>Se conservan</td>
<td>Se conservan</td>
</tr>
<tr>
<td><code>down</code></td>
<td>Para y <strong>elimina</strong> contenedores</td>
<td>Se pierden</td>
<td>Se conservan</td>
</tr>
<tr>
<td><code>down -v</code></td>
<td>Además borra los volúmenes <strong>del fichero</strong></td>
<td>Se pierden</td>
<td><strong>Se pierden</strong></td>
</tr>
<tr>
<td><code>pull</code></td>
<td>Descarga versiones nuevas de las imágenes</td>
<td>—</td>
<td>—</td>
</tr>
</tbody>
</table>
<p><code>up -d</code> <strong>recrea</strong> un contenedor si cambió su imagen o su configuración: se pierde su capa de escritura, pero no sus volúmenes</p>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="46" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="salud-y-dependencias-compose-s3yml">Salud y dependencias: <code>compose-s3.yml</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">services:</span>
  <span class="hljs-attr">rustfs-s3:</span>
    <span class="hljs-attr">image:</span> <span class="hljs-string">rustfs/rustfs:${RUSTFS_VERSION:-latest}</span>
    <span class="hljs-attr">volumes:</span>
      <span class="hljs-bullet">-</span> <span class="hljs-string">rustfs-s3-data:/data</span>
    <span class="hljs-attr">healthcheck:</span>
      <span class="hljs-attr">test:</span> [<span class="hljs-string">&quot;CMD-SHELL&quot;</span>, <span class="hljs-string">&quot;curl --fail http://127.0.0.1:9000/health &amp;&amp; ...&quot;</span>]
      <span class="hljs-attr">interval:</span> <span class="hljs-string">10s</span>
  <span class="hljs-attr">s3-client:</span>
    <span class="hljs-attr">image:</span> <span class="hljs-string">amazon/aws-cli:latest</span>
    <span class="hljs-attr">depends_on:</span>
      <span class="hljs-attr">rustfs-s3:</span>
        <span class="hljs-attr">condition:</span> <span class="hljs-string">service_healthy</span>     <span class="hljs-comment"># espera a que RustFS responda</span>
    <span class="hljs-attr">entrypoint:</span> [<span class="hljs-string">&quot;/bin/sh&quot;</span>, <span class="hljs-string">&quot;-c&quot;</span>]
    <span class="hljs-attr">command:</span> [<span class="hljs-string">&quot;while :; do sleep 3600; done&quot;</span>]   <span class="hljs-comment"># simplificado</span>
</code></pre>
<ul>
<li><code>healthcheck</code>: Docker ejecuta la prueba y marca <code>healthy</code> o <code>unhealthy</code></li>
<li><code>s3-client</code> no hace nada: queda vivo para usar <code>aws</code> con <code>docker exec</code></li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="47" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="construir-desde-compose-y-servicios-de-un-solo-uso-s6">Construir desde Compose y servicios de un solo uso (S6)</h1>
<p>Fragmentos de <code>compose-warehouse-hdfs.yml</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml">  <span class="hljs-attr">hive-metastore:</span>
    <span class="hljs-attr">build:</span>
      <span class="hljs-attr">context:</span> <span class="hljs-string">./hive-metastore</span>            <span class="hljs-comment"># directorio con el Dockerfile</span>
      <span class="hljs-attr">args:</span>
        <span class="hljs-attr">HIVE_IMAGE:</span> <span class="hljs-string">apache/hive:${HIVE_VERSION:-3.1.3}</span>
    <span class="hljs-attr">image:</span> <span class="hljs-string">tcdm/hive-metastore:${HIVE_VERSION:-3.1.3}</span>   <span class="hljs-comment"># nombre de la imagen</span>
  <span class="hljs-attr">trino-hdfs:</span>
    <span class="hljs-attr">volumes:</span>
      <span class="hljs-bullet">-</span> <span class="hljs-string">./trino-hdfs/etc:/etc/trino:ro</span>     <span class="hljs-comment"># configuración desde tu equipo</span>
  <span class="hljs-attr">catalog-init:</span>
    <span class="hljs-attr">entrypoint:</span> [<span class="hljs-string">&quot;/bin/sh&quot;</span>, <span class="hljs-string">&quot;/opt/tcdm/init/initialize-catalogs.sh&quot;</span>]
    <span class="hljs-attr">restart:</span> <span class="hljs-string">&quot;no&quot;</span>                          <span class="hljs-comment"># se ejecuta una vez y termina</span>
</code></pre>
<ul>
<li><code>build</code> + <code>image</code>: Compose construye en tu equipo y etiqueta el resultado</li>
<li><code>catalog-init</code> aparecerá como <code>Exited (0)</code>: es lo esperado</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="section-divider" data-theme="tcdm" data-lang="es" lang="es" class="section-divider" data-marpit-pagination="48" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:section-divider;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="el-makefile-del-entorno">El <code>Makefile</code> del entorno</h1>
<p>Las órdenes de Compose, con nombre propio</p>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="code" data-theme="tcdm" data-lang="es" lang="es" class="code" data-marpit-pagination="49" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:code;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="qu%C3%A9-hace-el-makefile">Qué hace el <code>Makefile</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-make">HADOOP_COMPOSE := docker compose -f compose-hadoop-cluster.yml

<span class="hljs-section">network:</span>
	docker network inspect hadoop-cluster &gt;/dev/null 2&gt;&amp;1 || docker network create hadoop-cluster

<span class="hljs-section">hadoop-up: network</span>
	<span class="hljs-variable">$(HADOOP_COMPOSE)</span> up -d

<span class="hljs-section">s3-up: network</span>
	<span class="hljs-variable">$(S3_COMPOSE)</span> up -d
</code></pre>
<ul>
<li><code>make -C entorno objetivo</code> entra en <code>entorno/</code> y ejecuta el objetivo: por eso dentro del <code>Makefile</code> las rutas no llevan <code>entorno/</code></li>
<li><code>hadoop-up: network</code> significa que antes se ejecuta <code>network</code></li>
<li><code>network</code> es <strong>idempotente</strong>: crea la red sólo si no existe</li>
</ul>
<footer>TCDM · Curso 2026/2027 · Docker y Docker Compose</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-footer="TCDM · Curso 2026/2027 · Docker y Docker Compose" data-class="dense" data-theme="tcdm" data-lang="es" lang="es" class="dense" data-marpit-pagination="50" style="--paginate:true;--footer:TCDM · Curso 2026/2027 · Docker y Docker Compose;--class:dense;--theme:tcdm;--lang:es;" data-marpit-pagination-total="64" data-size="16:9">
<h1 id="arrancar-parar-y-borrar-de-menos-a-m%C3%A1s-destructiva">Arrancar, parar y borrar: de menos a más destructiva</h1>
