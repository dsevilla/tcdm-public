connector.name=hive
hive.metastore=thrift
hive.metastore.uri=thrift://hive-metastore:9083
hive.metastore.authentication.type=NONE
hive.metastore.thrift.impersonation.enabled=false
hive.hdfs.authentication.type=NONE
hive.hdfs.impersonation.enabled=false
hive.non-managed-table-creates-enabled=true
hive.non-managed-table-writes-enabled=true
hive.storage-format=PARQUET
hive.compression-codec=ZSTD
fs.hadoop.enabled=true
# Grupos de filas de Parquet de hasta 32 MB: la mitad de dfs.blocksize (64 MB), para
# que los ficheros de varias decenas de MB tengan varios y Spark pueda repartirlos.
parquet.writer.row-group-size=32MB
