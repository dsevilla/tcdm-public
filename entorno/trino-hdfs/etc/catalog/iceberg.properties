connector.name=iceberg
# Catálogo Iceberg REST que sirve el propio Hive Metastore. Es el mismo
# catálogo que ve el conector `hive` por Thrift, expuesto con la API REST
# estándar de Iceberg, que también usa Spark.
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://hive-metastore:9001/iceberg
fs.hadoop.enabled=true
