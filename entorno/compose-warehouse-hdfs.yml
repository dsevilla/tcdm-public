name: tcdm-26-27-warehouse-hdfs

services:
  postgresql-metastore:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    container_name: postgresql-metastore
    hostname: postgresql-metastore
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: ${HIVE_POSTGRES_PASSWORD:-hive-local-password}
    volumes:
      - postgresql-metastore-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore_db"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      hadoop-cluster:

  hive-metastore:
    build:
      context: ./hive-metastore
      args:
        HIVE_IMAGE: apache/hive:${HIVE_VERSION:-3.1.3}
        POSTGRES_JDBC_VERSION: ${POSTGRES_JDBC_VERSION:-42.7.13}
    image: tcdm/hive-metastore:${HIVE_VERSION:-3.1.3}
    container_name: hive-metastore
    hostname: hive-metastore
    depends_on:
      postgresql-metastore:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HADOOP_USER_NAME: luser
      # hive.metastore.warehouse.dir se fija en ./hive-metastore/conf/hive-site.xml
      # (cargado vía HIVE_CUSTOM_CONF_DIR), no aquí como -D: la imagen 3.1.3
      # no honra esa propiedad concreta como -D, a diferencia de la 4.2.1.
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      SERVICE_OPTS: >-
        -Xmx1G
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgresql-metastore:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=${HIVE_POSTGRES_PASSWORD:-hive-local-password}
        -Dmetastore.try.direct.sql.ddl=false
    volumes:
      - ./hive-metastore/conf:/hive_custom_conf:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9083'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      hadoop-cluster:

  trino-hdfs:
    image: trinodb/trino:${TRINO_VERSION:-483}
    container_name: trino-hdfs
    hostname: trino-hdfs
    depends_on:
      hive-metastore:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: -DHADOOP_USER_NAME=luser
    ports:
      - "127.0.0.1:8080:8080"
    # Montamos directorios completos: Docker Desktop para macOS gestiona este
    # caso de forma más fiable que los bind mounts de ficheros individuales.
    # Esta configuración es exclusiva de HDFS y del Hive Metastore.
    volumes:
      - ./trino-hdfs/etc:/etc/trino:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 3072m
    networks:
      hadoop-cluster:

  catalog-init:
    image: trinodb/trino:${TRINO_VERSION:-483}
    container_name: tcdm-catalog-init
    depends_on:
      trino-hdfs:
        condition: service_healthy
    volumes:
      # Se monta el directorio para evitar problemas de ficheros individuales
      # en Docker Desktop para macOS.
      - ./init:/opt/tcdm/init:ro
    entrypoint: ["/bin/sh", "/opt/tcdm/init/initialize-catalogs.sh"]
    restart: "no"
    networks:
      hadoop-cluster:

  tpcds-init:
    profiles: ["init"]
    image: trinodb/trino:${TRINO_VERSION:-483}
    container_name: tcdm-tpcds-init
    depends_on:
      catalog-init:
        condition: service_completed_successfully
    environment:
      TPCDS_SCALE: ${TPCDS_SCALE:-sf1}
      TPCDS_TABLES: ${TPCDS_TABLES:-}
      TPCDS_DATALAKE_ROOT: ${TPCDS_DATALAKE_ROOT:-/datalake/raw/tpcds}
      INE_MUNICIPALITIES_ROOT: ${INE_MUNICIPALITIES_ROOT:-/datalake/raw/ine/municipios}
    volumes:
      # Este directorio contiene los scripts efímeros de inicialización.
      - ./init:/opt/tcdm/init:ro
      # Instantáneas versionadas de fuentes públicas usadas al materializar.
      - ./data:/opt/tcdm/data:ro
    entrypoint: ["/bin/sh", "/opt/tcdm/init/initialize-tpcds.sh"]
    restart: "no"
    networks:
      hadoop-cluster:

volumes:
  postgresql-metastore-data:
    name: tcdm-26-27-postgresql-metastore-data

networks:
  hadoop-cluster:
    external: true
    name: hadoop-cluster
