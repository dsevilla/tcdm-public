name: tcdm-26-27-s3

# Este Compose contiene solamente el almacenamiento de objetos de la sesión 3.
# No crea el bucket: lo crea s3.ipynb con boto3, para que el alumnado vea esa
# petición. Hadoop, Trino, Hive e Iceberg se arrancan en otros Compose y
# comparten la red externa hadoop-cluster.
services:
  rustfs-s3:
    image: rustfs/rustfs:${RUSTFS_VERSION:-latest}
    container_name: tcdm-rustfs-s3
    hostname: rustfs
    ports:
      - "127.0.0.1:9000:9000" # API compatible con S3
      - "127.0.0.1:9001:9001" # consola de RustFS
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-tcdm_student}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-tcdm_student_secret}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    volumes:
      - rustfs-s3-data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail http://127.0.0.1:9000/health && curl --fail http://127.0.0.1:9001/rustfs/console/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      hadoop-cluster:
        aliases:
          - rustfs

volumes:
  rustfs-s3-data:
    name: tcdm-26-27-rustfs-s3-data

networks:
  hadoop-cluster:
    external: true
    name: hadoop-cluster
