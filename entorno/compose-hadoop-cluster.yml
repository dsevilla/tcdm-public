name: tcdm-26-27-hadoop

services:
  namenode:
    image: ${NAMENODE_IMAGE:-dsevilla/namenode-image:26-27}
    container_name: namenode
    hostname: namenode
    ports:
      - "127.0.0.1:9870:9870" # HDFS NameNode
      - "127.0.0.1:8088:8088" # YARN ResourceManager
      - "127.0.0.1:8188:8188" # YARN Timeline Server
      - "127.0.0.1:8888:8888" # Reservado para Jupyter en sesiones posteriores
      - "127.0.0.1:4040:4040" # Reservado para Spark en sesiones posteriores
    # Límite de CPU del contenedor NameNode/ResourceManager. Es un límite,
    # no una reserva permanente de dos núcleos del equipo anfitrión.
    cpus: 2.0
    # El contenedor alojará también Jupyter y el driver de Spark en sesiones
    # posteriores, además de NameNode, ResourceManager y Timeline Server.
    mem_limit: 4096m
    # dfs.namenode.name.dir (ver namenode.sh) vive en /var/data/hdfs/namenode.
    # Sin este volumen, los metadatos HDFS quedan en la capa de escritura del
    # contenedor y cualquier `docker compose down` —incluidos `make stop` y
    # `make clean`— los destruye. El volumen es nuevo la primera vez que se
    # usa: Docker lo rellena con el contenido ya formateado de la imagen.
    volumes:
      - namenode-data:/var/data/hdfs/namenode
    networks:
      hadoop-cluster:
        aliases:
          - resourcemanager
          # El Timeline Server corre en namenode, sin añadir otro contenedor.
          - timelineserver

  datanode1:
    image: ${DATANODE_IMAGE:-dsevilla/datanode-image:26-27}
    container_name: datanode1
    hostname: datanode1
    # Cada DataNode necesita dos vCPU para que YARN pueda ejecutar un
    # executor Spark y, en uno de los nodos, el ApplicationMaster a la vez.
    # El mismo valor está anunciado en yarn-site.xml de la imagen.
    cpus: 2.0
    # YARN anuncia 2560 MiB y deja 512 MiB para DataNode, NodeManager y el
    # resto de procesos del contenedor.
    mem_limit: 3072m
    # dfs.datanode.data.dir (ver datanode.sh) vive en /var/data/hdfs/datanode.
    # Cada DataNode necesita su propio volumen: no comparten bloques entre sí.
    volumes:
      - datanode1-data:/var/data/hdfs/datanode
    networks:
      hadoop-cluster:

  datanode2:
    image: ${DATANODE_IMAGE:-dsevilla/datanode-image:26-27}
    container_name: datanode2
    hostname: datanode2
    # Mantener este límite sincronizado con la configuración YARN de la
    # imagen: yarn.nodemanager.resource.cpu-vcores=2.
    cpus: 2.0
    mem_limit: 3072m
    volumes:
      - datanode2-data:/var/data/hdfs/datanode
    networks:
      hadoop-cluster:

  datanode3:
    image: ${DATANODE_IMAGE:-dsevilla/datanode-image:26-27}
    container_name: datanode3
    hostname: datanode3
    # Mantener este límite sincronizado con la configuración YARN de la
    # imagen: yarn.nodemanager.resource.cpu-vcores=2.
    cpus: 2.0
    mem_limit: 3072m
    volumes:
      - datanode3-data:/var/data/hdfs/datanode
    networks:
      hadoop-cluster:

networks:
  hadoop-cluster:
    external: true
    name: hadoop-cluster

# Volúmenes con nombre explícito para poder referenciarlos desde `make
# clean-hdfs` (ver Makefile) sin depender del prefijo que añadiría Compose
# por defecto.
volumes:
  namenode-data:
    name: tcdm-26-27-namenode-data
  datanode1-data:
    name: tcdm-26-27-datanode1-data
  datanode2-data:
    name: tcdm-26-27-datanode2-data
  datanode3-data:
    name: tcdm-26-27-datanode3-data
