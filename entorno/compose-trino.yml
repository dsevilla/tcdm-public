name: tcdm-26-27-lakehouse

services:
  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION:-1.0.0-beta.12}
    container_name: tcdm-rustfs
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # RustFS console
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-polaris_root}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-polaris_pass}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    volumes:
      - rustfs-data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail http://127.0.0.1:9000/health && curl --fail http://127.0.0.1:9001/rustfs/console/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      hadoop-cluster:

  bucket-setup:
    image: amazon/aws-cli:latest
    container_name: tcdm-rustfs-bucket-setup
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-polaris_root}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-polaris_pass}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
      ICEBERG_BUCKET: ${ICEBERG_BUCKET:-tcdm-iceberg}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        if aws s3api head-bucket --bucket "$${ICEBERG_BUCKET}" >/dev/null 2>&1; then
          echo "Bucket $${ICEBERG_BUCKET} already exists";
        else
          aws s3 mb "s3://$${ICEBERG_BUCKET}";
        fi;
        aws s3 ls;
    networks:
      hadoop-cluster:

  polaris:
    image: apache/polaris:${POLARIS_VERSION:-1.7.0}
    container_name: tcdm-polaris
    depends_on:
      bucket-setup:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8181:8181" # Iceberg REST and management API
      - "127.0.0.1:8182:8182" # Health and metrics
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-polaris_root}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-polaris_pass}
      POLARIS_BOOTSTRAP_CREDENTIALS: ${POLARIS_REALM:-POLARIS},${POLARIS_CLIENT_ID:-root},${POLARIS_CLIENT_SECRET:-s3cr3t}
      POLARIS_REALM_CONTEXT_REALMS: ${POLARIS_REALM:-POLARIS}
      QUARKUS_OTEL_SDK_DISABLED: "true"
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": "true"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": '["FILE","S3","GCS","AZURE"]'
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    networks:
      hadoop-cluster:

  polaris-setup:
    image: alpine/curl:8.21.0
    container_name: tcdm-polaris-setup
    depends_on:
      polaris:
        condition: service_healthy
    environment:
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID:-root}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET:-s3cr3t}
      POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
      ICEBERG_CATALOG: ${ICEBERG_CATALOG:-quickstart_catalog}
      ICEBERG_BUCKET: ${ICEBERG_BUCKET:-tcdm-iceberg}
    volumes:
      # Directorio completo para que el bind mount sea fiable también en
      # Docker Desktop para macOS.
      - ./polaris:/opt/tcdm/polaris:ro
    entrypoint: ["/bin/sh", "/opt/tcdm/polaris/create-catalog.sh"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/polaris-setup-done"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      hadoop-cluster:

  trino:
    image: trinodb/trino:${TRINO_VERSION:-483}
    container_name: tcdm-trino
    depends_on:
      polaris-setup:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    # Este es el entorno Trino del laboratorio S3/Polaris. No se comparte con
    # trino-hdfs: ambos usan catálogos y almacenes distintos.
    volumes:
      - ./trino/etc:/etc/trino:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      hadoop-cluster:

  spark-iceberg:
    build:
      context: ./spark
      args:
        SPARK_BASE_IMAGE: ${SPARK_BASE_IMAGE:-apache/spark:4.1.3-scala2.13-java21-python3-ubuntu}
        ICEBERG_VERSION: ${ICEBERG_VERSION:-1.11.0}
    image: tcdm/spark-iceberg:26-27
    container_name: tcdm-spark-iceberg
    depends_on:
      polaris-setup:
        condition: service_healthy
    ports:
      - "127.0.0.1:4040-4045:4040-4045"
    command: ["tail", "-f", "/dev/null"]
    networks:
      hadoop-cluster:

volumes:
  rustfs-data:
    name: tcdm-26-27-rustfs-data

networks:
  hadoop-cluster:
    external: true
    name: hadoop-cluster
